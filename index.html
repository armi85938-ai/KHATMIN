.app{min-height:100vh;padding-bottom:105px}
.top{padding:25px 18px 12px;display:flex;align-items:center;justify-content:space-between}

.content{padding:8px 15px}
.section-title{font-size:14px;margin:13px 4px}
.chat-list{display:grid;gap:10px}
.chat-card{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #f0e4eb;background:rgba(255,255,255,.8);border-radius:21px;padding:13px;text-align:right;box-shadow:0 7px 22px rgba(170,110,145,.07)}
.avatar{width:51px;height:51px;border-radius:18px;background:linear-gradient(135deg,#ffe0ec,#e9defc);display:grid;place-items:center;font-weight:bold;color:#806474;flex:none}
.chat-avatar-image{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}.chat-profile .avatar{overflow:hidden}.chat-profile .avatar img{width:100%;height:100%;display:block;object-fit:cover}\n.chat-main{min-width:0;flex:1}
.chat-name{font-weight:bold;font-size:14px}

.bottom-nav{position:fixed;z-index:20;left:50%;bottom:17px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));height:68px;border:1px solid rgba(255,255,255,.75);border-radius:24px;background:rgba(255,255,255,.66);backdrop-filter:blur(20px);box-shadow:0 16px 45px rgba(130,90,120,.16);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.nav-btn{height:50px;border:0;background:transparent;display:grid;place-items:center;border-radius:18px}

.chat-view{min-height:100vh;display:flex;flex-direction:column}

/* chat screen */
.chat-header{

.chat-body:before{
  content:"KHATMIN";

  top:45%;

.composer{

.send:active{transform:scale(.93)}
@keyframes msgIn{
  from{opacity:0;transform:translateY(5px)}

/* ===== KHATMIN DARK + WHITE / LTR REDESIGN ===== */
html,body{
  direction:ltr;

}
body{

    radial-gradient(circle at 10% 0%,rgba(255,255,255,.055),transparent 28%),

.logo{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  background:transparent;
  border-radius:30px;
  box-shadow:none;

}
.logo img{
  position:relative;
  z-index:2;
  width:92px;
  height:92px;
  object-fit:contain;
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  clip-path:inset(100% 0 0 0);
  animation:logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards;
}
.logo:before{
  content:"";
  position:absolute;
  z-index:3;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px 5px rgba(255,255,255,.8);
  left:12px;
  top:96px;
  opacity:0;
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
  pointer-events:none;
}
.logo.replay:before{
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
}
.logo.replay:after{
  animation:logoAura 2.2s ease-out 1.25s forwards;
}
.logo:after{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:34px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 66%);
  filter:blur(5px);
  opacity:0;
  animation:logoAura 2.2s ease-out 1.25s forwards;
  pointer-events:none;
}
.login-card h1{color:#fff}
.subtitle{display:none}
.field label,.hint{color:#9a9ba3}
.field label{
  text-align:center;

}
.field input{
  background:#0e1014;
  color:#fff;

}
.field input::placeholder{text-align:center}
.login-btn{
  text-transform:uppercase;
  letter-spacing:1.2px;
}
@keyframes logoDraw{
  0%{clip-path:inset(100% 0 0 0);transform:scale(.88) rotate(-4deg);opacity:0}
  22%{opacity:1}
  70%{clip-path:inset(20% 0 0 0);transform:scale(1.015) rotate(1deg)}
  100%{clip-path:inset(0 0 0 0);transform:scale(1) rotate(0);opacity:1}
}
@keyframes logoPen{
  0%{opacity:0;left:12px;top:96px;transform:scale(.5)}
  12%{opacity:1}
  45%{left:52px;top:61px}
  72%{left:80px;top:28px}
  100%{left:96px;top:92px;opacity:0;transform:scale(.2)}
}
@keyframes logoGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  45%{filter:drop-shadow(0 0 15px rgba(255,255,255,.34))}
  100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.08))}
}
@keyframes logoAura{
  0%{opacity:0;transform:scale(.7)}
  45%{opacity:1;transform:scale(1.05)}
  100%{opacity:.35;transform:scale(1)}
}
.field input::placeholder{color:#686a73}

.chat-view{
  direction:rtl;
  background:#08090c;
  height:100dvh;
  min-height:0;

}
.chat-header{
  direction:ltr;
  flex:none;
  height:78px;
  min-height:78px;
  padding:8px 14px;
  display:grid;
  grid-template-columns:52px minmax(0,1fr) 52px;
  align-items:center;
  gap:10px;
  background:transparent !important;
  background-color:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  pointer-events:none;
}
.chat-header::before,.chat-header::after{
  content:none !important;
  display:none !important;
}
.chat-header > *{pointer-events:auto}
/* Three completely independent floating liquid-glass surfaces.
   The header itself has ZERO visual surface behind them. */
.chat-header > .chat-head-side,
.chat-header > .chat-profile{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border:1px solid rgba(255,255,255,.14);
  background:
    linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 52%,rgba(255,255,255,.055));
  box-shadow:
    0 12px 34px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 -1px 0 rgba(255,255,255,.025);
  backdrop-filter:blur(22px) saturate(165%);
  -webkit-backdrop-filter:blur(22px) saturate(165%);
}
.chat-header > .chat-head-side::before,
.chat-header > .chat-profile::before{
  content:"";
  position:absolute;
  inset:-55% -25%;
  z-index:-1;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.20),transparent 24%),
    radial-gradient(circle at 82% 82%,rgba(210,190,255,.075),transparent 30%),
    linear-gradient(120deg,transparent 28%,rgba(255,255,255,.055) 48%,transparent 67%);
  filter:blur(10px);
  transform:rotate(-8deg);
  pointer-events:none;
}
.chat-header > .chat-head-side{
  width:52px;height:52px;border-radius:50%;
  color:#fff;display:grid;place-items:center;
  padding:0;
}
.chat-header > .chat-head-side svg{width:25px;height:25px;stroke:currentColor}
.chat-header > .chat-profile{
  min-width:0;height:58px;padding:5px 14px 5px 8px;
  border-radius:31px;
  display:flex;align-items:center;gap:10px;
  direction:rtl;
}
.chat-profile .avatar{width:48px!important;height:48px!important;border-radius:50%!important;flex:none;background:#202126;color:#fff}
.chat-user-meta{
  position:relative;
  min-width:0;
  width:100%;
  max-width:220px;
  flex:1 1 auto;
  height:48px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  padding:0;
  overflow:visible;
}
.chat-title{
  color:#fff;
  width:100%;
  text-align:right;
  font-family:"Playfair Display",Caveat,Vazirmatn,serif;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:18px;
  font-weight:600;
  letter-spacing:.15px;
  line-height:22px;
  transform:translateY(0);
  transition:transform .24s cubic-bezier(.22,.8,.22,1);
}
.chat-typing{
  position:absolute;
  right:0;
  left:auto;
  top:27px;
  bottom:auto;
  transform:translateY(5px);
  min-height:15px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:5px;
  white-space:nowrap;
  color:#aeb0b8;
  font-size:10px;
  font-weight:500;
  line-height:14px;
  opacity:0;
  transition:opacity .22s ease,transform .24s cubic-bezier(.22,.8,.22,1);
  pointer-events:none;
  z-index:3;
}
.chat-user-meta.typing-active .chat-title{transform:translateY(-5px)}
.chat-typing.show{opacity:1;transform:translateY(0)}
.typing-dots{display:inline-flex;align-items:center;gap:3px;height:12px}
.typing-dots i{
  width:4px;height:4px;border-radius:50%;background:#bfc1c9;
  display:block;opacity:.35;
  animation:typingDot 1.05s infinite ease-in-out;
}
.typing-dots i:nth-child(2){animation-delay:.14s}
.typing-dots i:nth-child(3){animation-delay:.28s}
@keyframes typingDot{
  0%,60%,100%{transform:translateY(0);opacity:.3}
  30%{transform:translateY(-3px);opacity:1}
}
.chat-body{
  direction:rtl;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:92px 13px 110px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.025),transparent 25%),
    radial-gradient(circle at 80% 60%,rgba(255,255,255,.018),transparent 25%),
    #08090c;
}
.chat-body:before{color:rgba(255,255,255,.025)}
.msg{
  direction:rtl;
  text-align:right;
  color:#fff;
}
.msg.mine{
  align-self:flex-end;
  color:#0a0b0d;
  background:linear-gradient(145deg,#fff,#dedee2);
  border:1px solid #fff;
  border-bottom-left-radius:6px;
}
.msg.mine:after{background:#dedee2}
.msg.theirs{
  align-self:flex-start;
  color:#f3f3f5;
  background:linear-gradient(145deg,#17191e,#111318);
  border:1px solid #292b31;
  border-bottom-right-radius:6px;
}
.msg.theirs:after{background:#111318}
.msg-time{color:#85868e}
.composer{
  direction:ltr;
  position:fixed;
  z-index:30;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(145deg,rgba(255,255,255,.115),rgba(255,255,255,.035) 48%,rgba(255,255,255,.075));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 18px 48px rgba(0,0,0,.34),
    0 4px 14px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 -1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(24px) saturate(170%);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
}
.composer::before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:-80% -15%;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 30%,rgba(255,255,255,.18),transparent 25%),
    radial-gradient(circle at 72% 75%,rgba(210,190,255,.09),transparent 30%),
    linear-gradient(115deg,transparent 28%,rgba(255,255,255,.065) 48%,transparent 68%);
  filter:blur(12px);
  transform:rotate(-7deg);
  animation:composerLiquid 7s ease-in-out infinite alternate;
}
.composer::after{
  content:"";
  position:absolute;
  z-index:-1;
  left:10%;
  right:10%;
  top:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  opacity:.7;
  pointer-events:none;
}
@keyframes composerLiquid{
  0%{transform:translate3d(-2%,0,0) rotate(-7deg) scale(1)}
  100%{transform:translate3d(3%,2%,0) rotate(-3deg) scale(1.08)}
}
.composer input{color:#fff;text-align:right;direction:rtl}
.composer input::placeholder{color:#686a73}
.send{
  width:42px!important;
  height:42px!important;
  min-width:42px;
  border-radius:50%;
  background:#050608!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.28)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.10);
  display:grid;
  place-items:center;
}
.send:hover{background:#fff!important;color:#08090c!important}
.send:active{transform:scale(.92)}
.send svg{stroke:currentColor!important}

.login-brand{
  margin:8px 0 28px;
  text-align:center;
  font-family:"Cormorant Garamond","Times New Roman",serif;
  font-size:34px;
  font-weight:700;
  letter-spacing:.34em;
  padding-left:.34em;
  color:#fff;
  text-shadow:0 0 24px rgba(255,255,255,.12);
  position:relative;
}
.login-brand:after{
  content:"";
  display:block;
  width:46px;
  height:1px;
  margin:12px auto 0;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  opacity:.7;
}
@media(max-width:480px){
  .login-brand{font-size:30px;letter-spacing:.28em;padding-left:.28em}
}


/* KHATMIN title: prevent the final letter from being clipped */
.brand-title{
  overflow: visible !important;
  white-space: nowrap;
  min-width: max-content;
  padding-inline: 6px;
}


/* Modern icon-only navigation — no per-icon boxes */
.bottom-nav .nav-btn svg{
  width:24px !important;
  height:24px !important;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease, stroke-width .25s ease;
}
.bottom-nav .nav-btn:hover svg{
  transform:translateY(-2px) scale(1.08);
}
.bottom-nav .nav-btn.active svg{
  transform:translateY(-1px) scale(1.12);
  stroke-width:2 !important;
}


/* ===== Floating Jelly Navigation — isolated enhancement ===== */
.bottom-nav{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:17px;
  transform:translateX(-50%);
  width:min(390px,calc(100% - 28px));
  height:72px;
  padding:7px !important;
  display:flex !important;
  align-items:center !important;
  gap:4px !important;
  direction:ltr;
  overflow:visible !important;
  isolation:isolate;
  border:0;
  border-radius:30px;
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:none;
}
.bottom-nav::before{
  content:"";
  position:absolute;
  z-index:0;
  inset:0;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035)),rgba(13,14,18,.80);
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
  box-shadow:0 20px 55px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.22);
  transition:opacity .25s ease;
}
.bottom-nav::after{
  content:"";
  position:absolute;
  z-index:1;
  left:var(--jelly-left,50%);
  top:50%;
  width:0;
  height:0;
  transform:translate(-50%,-50%);
  transform-origin:center;
  border-radius:46% 54% 50% 50% / 44% 45% 55% 56%;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045)),rgba(13,14,18,.82);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 18px 34px rgba(0,0,0,.42),inset 0 1px 2px rgba(255,255,255,.55),inset 0 -8px 16px rgba(0,0,0,.12);
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
}
.bottom-nav.jelly-pulse::before{opacity:1}
.bottom-nav.jelly-pulse::after{animation:jellyMorph .38s cubic-bezier(.16,1,.3,1) both}
@keyframes jellyMorph{
  0%{opacity:0;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%) scale(.55)}
  18%{opacity:1;width:calc(var(--jelly-size,68px) * 1.55);height:calc(var(--jelly-size,68px) * .92);border-radius:42% 58% 52% 48% / 48% 42% 58% 52%;transform:translate(-50%,-50%) scale(1.05)}
  48%{opacity:1;width:calc(var(--jelly-size,68px) * 2.05);height:calc(var(--jelly-size,68px) * 1.12);border-radius:38% 62% 46% 54% / 56% 43% 57% 44%;transform:translate(-50%,-50%) scale(1)}
  72%{opacity:.92;width:calc(var(--jelly-size,68px) * 1.65);height:calc(var(--jelly-size,68px) * .98);border-radius:55% 45% 58% 42% / 45% 58% 42% 55%;transform:translate(-50%,-50%) scale(.98)}
  100%{opacity:0;width:calc(var(--jelly-size,68px) * 1.12);height:calc(var(--jelly-size,68px) * .82);border-radius:50%;transform:translate(-50%,-50%) scale(.96)}
}
.bottom-nav .nav-btn{
  position:relative;
  flex:1 1 0;
  min-width:0;
  height:56px !important;
  border:0 !important;
  background:transparent !important;
  border-radius:28px !important;
  display:grid !important;
  place-items:center !important;
  color:#fff !important;
  -webkit-text-fill-color:#fff;
  transition:transform .28s cubic-bezier(.16,1,.3,1),color .2s ease;
  z-index:1;
  overflow:visible !important;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav .nav-btn::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:50%;
  top:50%;
  width:52px;
  height:52px;
  transform:translate(-50%,-50%) scale(.72);
  border-radius:50%;
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 5px 18px rgba(0,0,0,.12);
  opacity:0;
  transition:transform .24s cubic-bezier(.16,1,.3,1),opacity .2s ease;
}
.bottom-nav .nav-btn.active::before{opacity:1;transform:translate(-50%,-50%) scale(.94);background:rgba(255,255,255,.10)}
.bottom-nav .nav-btn:hover{transform:translateY(-2px);color:#fff !important}
.bottom-nav .nav-btn:active{transform:translateY(1px) scale(.96)}
.bottom-nav .nav-btn svg{
  position:relative;
  z-index:2;
  width:27px !important;
  height:27px !important;
  color:#fff !important;
  stroke:currentColor !important;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.38)) drop-shadow(0 0 7px rgba(255,255,255,.10));
  transition:width .28s cubic-bezier(.16,1,.3,1),height .28s cubic-bezier(.16,1,.3,1),transform .28s cubic-bezier(.16,1,.3,1),filter .22s ease;
}
.bottom-nav .nav-btn.active svg{
  width:30px !important;
  height:30px !important;
  transform:translateY(-1px) scale(1.04);
  stroke-width:2.05 !important;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.42)) drop-shadow(0 0 10px rgba(255,255,255,.20));
}
.bottom-nav .nav-btn.jelly-target{z-index:3;animation:iconJelly .38s cubic-bezier(.16,1,.3,1) both}
@keyframes iconJelly{
  0%{transform:translateY(0) scale(1)}
  22%{transform:translateY(-5px) scale(1.06,1.13)}
  48%{transform:translateY(-7px) scale(1.16,.94)}
  70%{transform:translateY(-2px) scale(.98,1.05)}
  100%{transform:translateY(0) scale(1)}
}
@media(max-width:480px){
  .bottom-nav{width:calc(100% - 22px);bottom:12px;height:68px;border-radius:27px}
  .bottom-nav .nav-btn{height:52px !important}
  .bottom-nav .nav-btn svg{width:25px !important;height:25px !important}
  .bottom-nav .nav-btn.active svg{width:29px !important;height:29px !important}
}
@media (prefers-reduced-motion:reduce){
  .bottom-nav,.bottom-nav::before,.bottom-nav::after,.bottom-nav .nav-btn,.bottom-nav .nav-btn::before,.bottom-nav .nav-btn svg{animation:none !important;transition:none !important}
}

.msg-wrap.mine{
  align-items:flex-end !important;
  margin-left:auto !important;
  margin-right:0 !important;
}
.msg-wrap.theirs{
  align-items:flex-start !important;
  margin-left:0 !important;
  margin-right:auto !important;
}
.msg-wrap .msg.mine{
  align-self:flex-end !important;
  margin-left:auto !important;
  margin-right:0 !important;
}
.msg-wrap .msg.theirs{
  align-self:flex-start !important;
  margin-left:0 !important;
  margin-right:auto !important;
}

/* ===== Message actions / reply / edit ===== */
.msg-wrap{position:relative;display:flex;flex-direction:column;width:100%;touch-action:pan-y}
.msg-wrap.mine{align-items:flex-end}.msg-wrap.theirs{align-items:flex-start}
.msg-wrap .msg{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .18s ease,opacity .18s ease}
.msg-wrap.swiping .msg{transition:none}
.msg-wrap.replying .msg{box-shadow:0 0 0 1px rgba(255,255,255,.28),0 8px 24px rgba(255,255,255,.08)}
.msg-reply-preview{max-width:100%;min-width:0;margin-bottom:6px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.08);border-left:3px solid rgba(255,255,255,.55);font-size:10px;color:#aeb0b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.mine .msg-reply-preview{background:rgba(0,0,0,.055);border-left-color:rgba(0,0,0,.35);color:#666870}
.msg.deleted{font-style:italic;opacity:.72}
.msg-reaction-badge{position:absolute;right:-7px;bottom:-9px;min-width:25px;height:25px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:rgba(20,21,26,.94);border:1px solid rgba(255,255,255,.18);box-shadow:0 5px 14px rgba(0,0,0,.38);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:14px;line-height:1;z-index:3}
.reaction-pop{animation:reactionPop .34s cubic-bezier(.2,.9,.2,1)}
@keyframes reactionPop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
.msg-edited{font-size:8px;color:inherit;opacity:.58;margin-right:5px}
.reply-bar{position:fixed;z-index:12;left:50%;bottom:82px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:9px 12px;border-radius:18px;background:rgba(20,21,26,.96);border:1px solid #2c2e35;box-shadow:0 12px 35px rgba(0,0,0,.42);display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s ease,transform .2s ease}
.reply-bar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.reply-bar.editing{border-color:rgba(255,255,255,.24)}
.reply-bar-icon{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:#fff;color:#0a0b0d;flex:none;font-size:14px}
.reply-bar-text{min-width:0;flex:1;text-align:left}
.reply-bar-label{font-size:9px;color:#aaaeb7;margin-bottom:2px}
.reply-bar-content{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar-close{width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:#8d9099;font-size:18px;display:grid;place-items:center}
.message-sheet-backdrop{position:fixed;z-index:30;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(5px) saturate(120%);-webkit-backdrop-filter:blur(5px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .18s ease}
.message-sheet-backdrop.show{opacity:1;pointer-events:auto}
.message-sheet{position:fixed;z-index:31;left:50%;bottom:14px;transform:translate(-50%,18px) scale(.98);width:min(430px,calc(100% - 24px));padding:8px;border-radius:25px;background:linear-gradient(145deg,rgba(24,25,31,.94),rgba(14,15,19,.91));border:1px solid rgba(255,255,255,.13);box-shadow:0 25px 65px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .22s cubic-bezier(.16,1,.3,1)}
.message-sheet.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.message-reactions{height:58px;margin:-1px -1px 7px;padding:6px 9px;display:flex;align-items:center;justify-content:space-around;gap:4px;border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(22px) saturate(155%);-webkit-backdrop-filter:blur(22px) saturate(155%);overflow:hidden}
.message-reaction{width:42px;height:42px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:25px;line-height:1;cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.2,1),background .18s ease,filter .18s ease}
.message-reaction:hover{transform:translateY(-3px) scale(1.1);background:rgba(255,255,255,.08)}
.message-reaction:active{transform:scale(.82)}
.message-sheet-title{padding:8px 11px 7px;color:#858892;font-size:9px;text-align:center}
.message-action{width:100%;height:46px;border:0;border-radius:15px;background:transparent;color:#f4f4f6;display:flex;align-items:center;gap:11px;padding:0 13px;text-align:left;font-size:12px}
.message-action:hover{background:#292b31}.message-action:active{transform:scale(.985)}
.message-action .action-icon{width:30px;height:30px;border-radius:10px;background:#2b2d34;display:grid;place-items:center;font-size:14px;flex:none}
.message-action.danger{color:#ff9aaa}.message-action.danger .action-icon{background:rgba(255,100,125,.10)}
.delete-confirm-backdrop{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .18s ease}
.delete-confirm-backdrop.show{opacity:1;pointer-events:auto}
.delete-confirm{width:min(330px,calc(100% - 38px));padding:16px;border-radius:24px;background:linear-gradient(145deg,rgba(28,29,35,.96),rgba(13,14,18,.94));border:1px solid rgba(255,255,255,.14);box-shadow:0 28px 75px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);transform:translateY(10px) scale(.97);transition:transform .2s cubic-bezier(.16,1,.3,1)}
.delete-confirm-backdrop.show .delete-confirm{transform:translateY(0) scale(1)}
.delete-confirm-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.delete-confirm-icon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,95,120,.10);color:#ff9aaa;font-size:17px}
.delete-confirm-title{color:#fff;font-size:14px;font-weight:700}
.delete-confirm-text{color:#9699a2;font-size:10px;line-height:1.8;margin-bottom:13px}
.delete-everyone-check{display:flex;align-items:center;gap:10px;min-height:43px;padding:0 11px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:#eeeef1;font-size:11px;cursor:pointer;user-select:none}

.delete-everyone-check input:checked{background:#fff;border-color:#fff}
.delete-everyone-check input:checked::after{content:"✓";color:#090a0c;font-size:13px;font-weight:900}
.delete-everyone-check.disabled{opacity:.48;cursor:default}
.delete-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.delete-confirm-btn{height:40px;border:0;border-radius:13px;font-size:11px;font-weight:700;cursor:pointer}
.delete-confirm-cancel{background:rgba(255,255,255,.065);color:#d9d9de;border:1px solid rgba(255,255,255,.08)}

/* ===== Fast local cache =====
   The browser keeps previously loaded contacts/messages in IndexedDB.
   Supabase remains the source of truth; after the first sync only newer
   messages are requested in the background. */
const LOCAL_CACHE_DB="khatmin-local-cache-v1";
let localCacheDBPromise=null;
function openLocalCache(){
  if(localCacheDBPromise)return localCacheDBPromise;
  localCacheDBPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(LOCAL_CACHE_DB,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains("profiles"))db.createObjectStore("profiles",{keyPath:"key"});
        if(!db.objectStoreNames.contains("messages"))db.createObjectStore("messages",{keyPath:"key"});
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e)}
  });
  return localCacheDBPromise;
}
async function localCacheGet(store,key){
  try{const db=await openLocalCache();return await new Promise((resolve,reject)=>{const r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}
}
async function localCacheGetAll(store,prefix){
  try{const db=await openLocalCache();return await new Promise((resolve,reject)=>{const out=[];const r=db.transaction(store,"readonly").objectStore(store).openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return resolve(out);if(!prefix||String(c.key).startsWith(prefix))out.push(c.value);c.continue()};r.onerror=()=>reject(r.error)})}catch(e){return []}
}
async function localCachePutAll(store,rows){
  if(!rows?.length)return;
  try{const db=await openLocalCache();await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");const os=tx.objectStore(store);rows.forEach(x=>os.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){console.warn("LOCAL CACHE WRITE:",e)}
}
async function localCacheDelete(store,key){try{const db=await openLocalCache();await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}}
function profileCacheKey(userId,partnerId){return `${String(userId)}:${String(partnerId)}`}
function messageCacheKey(userId,messageId){return `${String(userId)}:${String(messageId)}`}
async function getCachedProfiles(){return (await localCacheGetAll("profiles",`${currentUser.id}:`)).map(x=>x.profile).filter(Boolean)}
async function cacheProfiles(profiles){await localCachePutAll("profiles",(profiles||[]).map(profile=>({key:profileCacheKey(currentUser.id,profile.id),profile}))) }
async function getCachedMessages(partnerId){return (await localCacheGetAll("messages",`${currentUser.id}:${String(partnerId)}:`)).map(x=>x.message).filter(Boolean).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
async function cacheMessages(messages){await localCachePutAll("messages",(messages||[]).filter(Boolean).map(message=>({key:messageCacheKey(currentUser.id,message.id).replace(`${currentUser.id}:`,`${currentUser.id}:${String(message.sender_id===currentUser.id?message.receiver_id:message.sender_id)}:`),message}))) }
async function getCachedAllMessages(){return (await localCacheGetAll("messages",`${currentUser.id}:`)).map(x=>x.message).filter(Boolean)}
function mergeMessagesIntoCache(list,extra){
  const map=new Map((list||[]).map(m=>[String(m.id),m]));
  (extra||[]).forEach(m=>map.set(String(m.id),m));
  return Array.from(map.values()).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

}

function replayLoginLogo(){
  const logo=document.getElementById("loginLogo");
  if(!logo) return;
  const img=logo.querySelector("img");
  if(!img) return;
  img.style.animation="none";
  logo.style.setProperty("--logo-replay","none");
  void img.offsetWidth;
  img.style.animation="logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards";
  logo.classList.remove("logo-replay");
  void logo.offsetWidth;
  logo.classList.add("logo-replay");
}

async function login(username,password){
  const u=username.trim();
  if(!u || !password) throw new Error("نام کاربری و رمز عبور را وارد کنید.");

  const {data,error}=await supabaseClient.rpc("login_with_username",{
    p_username:u,
    p_password:password
  });

  if(error){
    console.error("LOGIN RPC ERROR:",error);
    throw new Error("خطای اتصال به دیتابیس: "+(error.message||"RPC error"));
  }

  if(!data || !data.length){
    throw new Error("نام کاربری یا رمز عبور اشتباه است.");
  }

  return data[0];
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("loginBtn");
  setLoginError("");
  btn.disabled=true;
  btn.classList.add("loading");
  btn.textContent="در حال ورود...";

  try{
    let profile=await login(
      document.getElementById("username").value,
      document.getElementById("password").value
    );

    // Always resolve the logged-in user from the real profiles table.
    // This prevents an old/mismatched RPC id from breaking contacts and messages.
    try{
      const loginUsername=String(profile?.username||document.getElementById("username").value||"").trim();
      if(loginUsername){
        const {data:canonicalProfile}=await supabaseClient
          .from("profiles")
          .select("id,username,display_name,avatar_url,bio")
          .eq("username",loginUsername)
          .maybeSingle();
        if(canonicalProfile?.id){ profile={...profile,...canonicalProfile}; }
      }
    }catch(resolveError){
      console.warn("Could not resolve canonical profile; using login profile:",resolveError);
    }

    currentUser={profile,id:profile.id};
    sessionStorage.setItem("love_profile",JSON.stringify(profile));
    await loadApp();
  }catch(err){
    console.error(err);
    setLoginError(err.message||"ورود انجام نشد.");
  }finally{
    btn.disabled=false;
    btn.classList.remove("loading");
    btn.textContent="LOGIN";
  }
});

async function loadApp(){
  // قبل از باز کردن پیام‌رسان، شناسه کاربر را با رکورد واقعی profiles هماهنگ می‌کنیم.
  // این کار نشست‌های قدیمی را که باعث messages_sender_id_fkey می‌شوند خودکار ترمیم می‌کند.
  try{
    let canonical=null;
    if(currentUser?.profile?.username){
      const {data,error}=await supabaseClient
        .from("profiles")
        .select("id,username,display_name,avatar_url,bio")
        .eq("username",String(currentUser.profile.username).trim())
        .maybeSingle();
      if(!error && data) canonical=data;
    }
    if(!canonical && currentUser?.id){
      const {data,error}=await supabaseClient
        .from("profiles")
        .select("id,username,display_name,avatar_url,bio")
        .eq("id",currentUser.id)
        .maybeSingle();
      if(!error && data) canonical=data;
    }
    if(!canonical?.id){
      sessionStorage.removeItem("love_profile");
      currentUser=null;
      document.getElementById("app").innerHTML="";
      document.getElementById("loginScreen").classList.remove("hidden");
      setLoginError("نشست قبلی منقضی شده؛ لطفاً دوباره وارد شوید.");
      return;
    }
    currentUser={profile:{...(currentUser.profile||{}),...canonical},id:canonical.id};
    sessionStorage.setItem("love_profile",JSON.stringify(currentUser.profile));
  }catch(err){
    console.error("PROFILE SYNC ERROR:",err);
    document.getElementById("app").innerHTML="";
    document.getElementById("loginScreen").classList.remove("hidden");
    setLoginError("اتصال اطلاعات کاربر برقرار نشد؛ دوباره وارد شوید.");
    return;
  }

  document.getElementById("loginScreen").classList.add("hidden");
  await renderHome();
}

let pendingSettingsAvatar="";

let avatarCropState=null;
function handleSettingsAvatar(input){
  const file=input?.files?.[0]; if(!file)return;
  if(!file.type.startsWith("image/")){alert("لطفاً یک عکس انتخاب کنید.");input.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();img.onload=()=>{avatarCropState={img,scale:1,x:0,y:0,input};const preview=document.getElementById("avatarCropImage"),zoom=document.getElementById("avatarCropZoom");if(!preview)return;preview.src=reader.result;zoom.value="1";document.getElementById("avatarCropBackdrop")?.classList.add("show");requestAnimationFrame(fitAvatarCropImage)};img.src=reader.result};
  reader.readAsDataURL(file);
}
function fitAvatarCropImage(){if(!avatarCropState)return;const stage=document.getElementById("avatarCropStage");const preview=document.getElementById("avatarCropImage");if(!stage||!preview)return;const r=stage.getBoundingClientRect();avatarCropState.base=Math.max(r.width/avatarCropState.img.width,r.height/avatarCropState.img.height);avatarCropState.scale=Number(document.getElementById("avatarCropZoom")?.value||1);avatarCropState.x=0;avatarCropState.y=0;updateAvatarCropPreview()}
function updateAvatarCropPreview(){if(!avatarCropState)return;const preview=document.getElementById("avatarCropImage");if(!preview)return;const scale=avatarCropState.base*avatarCropState.scale;preview.style.width=`${avatarCropState.img.width*scale}px`;preview.style.height=`${avatarCropState.img.height*scale}px`;preview.style.transform=`translate(calc(-50% + ${avatarCropState.x}px),calc(-50% + ${avatarCropState.y}px))`}
function closeAvatarCrop(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("avatarCropBackdrop")?.classList.remove("show");if(avatarCropState?.input)avatarCropState.input.value="";avatarCropState=null}
function applyAvatarCrop(){if(!avatarCropState)return;const stage=document.getElementById("avatarCropStage");if(!stage)return;const r=stage.getBoundingClientRect(),out=420,sourceScale=avatarCropState.base*avatarCropState.scale,crop=r.width,sw=crop/sourceScale,sx=avatarCropState.img.width/2-(crop/2+avatarCropState.x)/sourceScale,sy=avatarCropState.img.height/2-(crop/2+avatarCropState.y)/sourceScale,canvas=document.createElement("canvas");canvas.width=out;canvas.height=out;canvas.getContext("2d").drawImage(avatarCropState.img,sx,sy,sw,sw,0,0,out,out);pendingSettingsAvatar=canvas.toDataURL("image/jpeg",.84);const picker=document.querySelector(".settings-avatar-picker");if(picker)picker.innerHTML=`<img src="${pendingSettingsAvatar}" alt="عکس پروفایل" class="settings-avatar-image"><span class="settings-avatar-camera">${icons.plus}</span>`;closeAvatarCrop()}
function initAvatarCropInteractions(){const stage=document.getElementById("avatarCropStage"),zoom=document.getElementById("avatarCropZoom");if(!stage||!zoom)return;zoom.oninput=()=>{if(avatarCropState){avatarCropState.scale=Number(zoom.value);updateAvatarCropPreview()}};let drag=false,lx=0,ly=0;stage.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture?.(e.pointerId)};stage.onpointermove=e=>{if(!drag||!avatarCropState)return;avatarCropState.x+=e.clientX-lx;avatarCropState.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;updateAvatarCropPreview()};stage.onpointerup=stage.onpointercancel=()=>drag=false}
document.addEventListener("DOMContentLoaded",initAvatarCropInteractions);
async function saveSettingsProfile(){
  if(!currentUser?.id)return;
  const name=document.getElementById("settingsDisplayName")?.value.trim();
  const bio=document.getElementById("settingsBio")?.value.trim()||"";
  if(!name){alert("لطفاً نام را وارد کنید.");return;}

  const btn=document.querySelector(".settings-save");
  if(btn){btn.disabled=true;btn.textContent="در حال ذخیره..."}

  const payload={display_name:name,bio};
  if(pendingSettingsAvatar)payload.avatar_url=pendingSettingsAvatar;

  const {data,error}=await supabaseClient
    .from("profiles")
    .update(payload)
    .eq("id",currentUser.id)
    .select("id,username,display_name,avatar_url,bio")
    .maybeSingle();

  // Only update the local/session profile after Supabase confirms the row.
  currentUser={profile:{...currentUser.profile,...data},id:currentUser.id};

function setHomeTyping(partnerId,show){
  const card=document.querySelector(`.chat-card[data-partner-id="${CSS.escape(String(partnerId))}"]`);
  const last=card?.querySelector(".chat-last");
  if(!last)return;
  clearTimeout(homeTypingTimers.get(String(partnerId)));
  if(show){
    last.textContent="در حال نوشتن";
    last.classList.add("typing-state");
    homeTypingTimers.set(String(partnerId),setTimeout(()=>setHomeTyping(partnerId,false),2600));
  }else{
    last.textContent=last.dataset.lastText||"";
    last.classList.remove("typing-state");
    homeTypingTimers.delete(String(partnerId));

function bumpHomeUnread(partnerId){
  const card=document.querySelector(`.chat-card[data-partner-id="${CSS.escape(String(partnerId))}"]`);
  if(!card)return;
  const meta=card.querySelector(".chat-meta");
  let badge=meta?.querySelector(".unread-badge");
  const current=Number(badge?.textContent?.replace(/\D/g,"")||0);
  if(meta){
    if(!badge){badge=document.createElement("div");badge.className="unread-badge";meta.appendChild(badge)}
    badge.textContent=String(Math.min(99,current+1));
  }

function updateHomeLastMessage(m){
  const partnerId=String(m.sender_id===currentUser.id?m.receiver_id:m.sender_id);
  const card=document.querySelector(`.chat-card[data-partner-id="${CSS.escape(partnerId)}"]`);
  if(!card)return;
  const last=card.querySelector(".chat-last");
  const time=card.querySelector(".chat-time");
  if(last){last.dataset.lastText=m.content||"";last.textContent=m.content||"";last.classList.remove("typing-state")}
  if(time)time.textContent=faTime(m.created_at);
  if(m.sender_id!==currentUser.id)bumpHomeUnread(partnerId);
}

async function subscribeHomeInbox(){
  if(!currentUser)return;
  if(homeInboxChannel){try{await supabaseClient.removeChannel(homeInboxChannel)}catch(e){}homeInboxChannel=null}
  const name="love-home-inbox-"+currentUser.id;
  homeInboxChannel=supabaseClient
    .channel(name,{config:{broadcast:{self:false}}})
    .on("broadcast",{event:"typing"},payload=>{
      const data=payload?.payload||{};
      if(!data.sender_id || String(data.sender_id)===String(currentUser.id))return;
      setHomeTyping(String(data.sender_id),!!data.is_typing);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
      const m=payload.new;
      if(String(m.receiver_id)!==String(currentUser.id))return;
      updateHomeLastMessage(m);
    })
    .subscribe(status=>console.log("Home inbox realtime:",status));
}

function getLastReadAt(partnerId){return localStorage.getItem(getReadKey(partnerId))||"1970-01-01T00:00:00.000Z";}
function markChatRead(partnerId,latestCreatedAt){
  if(!partnerId)return;

async function renderChats(){
  const list=document.getElementById("chatList");
  if(!list||!currentUser)return;

  // Paint the cached contacts immediately. The database sync happens in the background.
  let profiles=await getCachedProfiles();
  const myId=String(currentUser?.id||"");
  const myUsername=String(currentUser?.profile?.username||"").trim().toLowerCase();
  profiles=(profiles||[]).filter(p=>{
    const pid=String(p?.id||"");
    const pun=String(p?.username||"").trim().toLowerCase();
    return pid && pid!==myId && (!myUsername || pun!==myUsername);
  }).sort((a,b)=>String(a.display_name||a.username).localeCompare(String(b.display_name||b.username),'fa'));

  const renderCards=(allMessages)=>{
    const cards=[];
    for(const p of profiles){
      const pair=(allMessages||[]).filter(m=>String(m.sender_id)===String(p.id)||String(m.receiver_id)===String(p.id));
      const m=pair[pair.length-1];
      const readAt=getLastReadAt(p.id);
      const unread=pair.filter(x=>String(x.sender_id)===String(p.id)&&String(x.receiver_id)===String(currentUser.id)&&new Date(x.created_at)>new Date(readAt)).length;
      cards.push(`
        <button class="chat-card" data-partner-id="${esc(p.id)}" onclick='openChat(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
          <div class="avatar">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="" class="chat-avatar-image">` : esc((p.display_name||p.username||"?").slice(0,1))}</div>
          <div class="chat-main">
            <div class="chat-name">${esc(p.display_name)}</div>
            <div class="chat-last" data-last-text="${esc(m?m.content:"هنوز پیامی ندارید ♡")}">${m?esc(m.content):"هنوز پیامی ندارید ♡"}</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">${m?faTime(m.created_at):""}</div>
            ${unread>0?`<div class="unread-badge">${unread>99?"99+":unread}</div>`:""}
          </div>
        </button>`);
    }
    list.innerHTML=cards.length?cards.join(""):"<div class=\"empty\">مخاطب دیگری پیدا نشد.</div>";
  };

  const cachedMessages=await getCachedAllMessages();
  if(profiles.length) renderCards(cachedMessages);
  else list.innerHTML=`<div class="empty">در حال آماده‌سازی...</div>`;

  // First visit: one profiles query + one messages query. Later visits: only new messages.
  try{
    const {data:freshProfiles,error:pErr}=await supabaseClient
      .from("profiles").select("id,username,display_name,avatar_url,bio")
      .neq("id",currentUser.id).order("display_name");
    if(pErr)throw pErr;
    profiles=(freshProfiles||[]);
    await cacheProfiles(profiles);

    const allCached=await getCachedAllMessages();
    const latestCached=allCached.reduce((max,m)=>Math.max(max,new Date(m.created_at).getTime()),0);
    let query=supabaseClient.from("messages")
      .select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone")
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
      .order("created_at",{ascending:true});
    if(latestCached)query=query.gt("created_at",new Date(latestCached).toISOString());
    let {data:newMessages,error:mErr}=await query;
    if(mErr && /column .* does not exist/i.test(mErr.message||"")){
      let fallback=supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at")
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order("created_at",{ascending:true});
      if(latestCached)fallback=fallback.gt("created_at",new Date(latestCached).toISOString());
      const r=await fallback;newMessages=r.data;mErr=r.error;
    }
    if(mErr)throw mErr;
    await cacheMessages(newMessages||[]);
    renderCards(await getCachedAllMessages());
  }catch(err){
    console.warn("BACKGROUND CHAT CACHE SYNC:",err);
    if(!profiles.length && !list.innerHTML.trim())list.innerHTML=`<div class="empty">خطا در دریافت مخاطب‌ها: ${esc(err.message||"خطای اتصال")}</div>`;
  }
}

  const messageInput=document.getElementById("messageInput");

async function loadMessages(){
  const box=document.getElementById("messages");
  if(!box||!chatPartner)return;

  // Cached messages are rendered first, so reopening a chat is effectively instant.
  let cached=await getCachedMessages(chatPartner.id);
  if(cached.length){
    hiddenMessageIds=new Set();
    messageCache=new Map();
    cached.forEach(m=>messageCache.set(String(m.id),m));
    box.innerHTML=cached.map(renderMessage).join("");
    attachMessageGestures();
    box.scrollTop=box.scrollHeight;
  }

  messageReactionCache.clear();
  // Sync only messages newer than the newest locally stored message.
  syncChatMessages(cached.length?cached[cached.length-1].created_at:null).catch(e=>console.warn("CHAT BACKGROUND SYNC:",e));

  if(!cached.length)box.innerHTML=`<div class="empty">در حال دریافت پیام‌ها...</div>`;
}

async function syncChatMessages(latestCreatedAt){
  if(!chatPartner||!currentUser)return;
  const partnerId=String(chatPartner.id);
  const messageFilter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`;
  let query=supabaseClient.from("messages")
    .select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone")
    .or(messageFilter).order("created_at",{ascending:true});
  if(latestCreatedAt)query=query.gt("created_at",latestCreatedAt);
  let {data,error}=await query;
  if(error && /column .* does not exist/i.test(error.message||"")){
    let fallback=supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at")
      .or(messageFilter).order("created_at",{ascending:true});
    if(latestCreatedAt)fallback=fallback.gt("created_at",latestCreatedAt);
    const r=await fallback;data=r.data;error=r.error;
  }
  if(error)throw error;
  await cacheMessages(data||[]);

  const merged=mergeMessagesIntoCache(await getCachedMessages(partnerId),data||[]);
  messageCache=new Map(merged.map(m=>[String(m.id),m]));
  const box=document.getElementById("messages");
  if(!box||!chatPartner||String(chatPartner.id)!==partnerId)return;
  if(!merged.length){box.innerHTML=`<div class="empty">هنوز گفت‌وگویی شروع نشده ♡</div>`;return;}
  syncChatExtras(merged).catch(e=>console.warn("CHAT EXTRAS SYNC:",e));
  const wasAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
  box.innerHTML=merged.map(renderMessage).join("");
  attachMessageGestures();
  if(wasAtBottom||!latestCreatedAt)box.scrollTop=box.scrollHeight;
  const newestIncoming=merged.filter(m=>String(m.sender_id)===partnerId);
  if(newestIncoming.length)markChatRead(partnerId,newestIncoming[newestIncoming.length-1].created_at);
}
async function syncChatExtras(messages){
  const ids=(messages||[]).map(m=>m.id).filter(Boolean);
  if(!ids.length||!currentUser)return;
  try{
    const {data:hidden,error:hiddenError}=await supabaseClient.from("message_user_deletions")
      .select("message_id").eq("user_id",currentUser.id).in("message_id",ids);
    if(!hiddenError){
      hiddenMessageIds=new Set((hidden||[]).map(x=>String(x.message_id)));
      hiddenMessageIds.forEach(id=>{messageCache.delete(id);document.querySelector(`[data-msg-id="${CSS.escape(id)}"]`)?.remove()});
      ensureMessageEmptyState();
    }
  }catch(e){}
  try{
    const {data:reactions}=await supabaseClient.from("message_reactions")
      .select("message_id,user_id,reaction,created_at").in("message_id",ids).order("created_at",{ascending:false});
    messageReactionCache.clear();
    (reactions||[]).forEach(r=>{if(!messageReactionCache.has(String(r.message_id)))messageReactionCache.set(String(r.message_id),r)});
    (messages||[]).forEach(m=>{if(!hiddenMessageIds.has(String(m.id)))refreshMessageElement(m,true)});
  }catch(e){}
}

function messageDisplayText(m){
  if(m.deleted_for_everyone) return "این پیام حذف شد";
  return m.content||"";
}

function replyPreviewHtml(m){
  if(!m?.reply_to_id)return "";
  const original=messageCache.get(String(m.reply_to_id));
  const text=original ? messageDisplayText(original) : "پیام قبلی";
  return `<div class="msg-reply-preview">↩ ${esc(text)}</div>`;
}

function renderMessage(m){
  const mine=m.sender_id===currentUser.id;
  const deleted=!!m.deleted_for_everyone;
  const cls=`msg ${mine?"mine":"theirs"}`;
  const footer=deleted
    ? ""
    : `<div class="msg-footer"><span class="msg-time">${faTime(m.created_at)}</span>${m.edited_at?`<span class="msg-edited">ویرایش شد</span>`:""}</div>`;
  const reaction=messageReactionCache.get(String(m.id));
  const reactionBadge=(!deleted && reaction?.reaction)
    ? `<span class="msg-reaction-badge" title="واکنش">${esc(reaction.reaction)}</span>`
    : "";
  const body=`<span class="${cls}${deleted?" deleted":""}">${deleted?esc(messageDisplayText(m)):`${replyPreviewHtml(m)}${esc(m.content||"")}`}${reactionBadge}${footer}</span>`;
  return `<div class="msg-wrap ${mine?"mine":"theirs"}" data-msg-id="${esc(m.id)}">${body}</div>`;
}

function refreshMessageElement(m,animateReaction=false){
  const old=document.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"]`);

  old.outerHTML=renderMessage(m);

  if(animateReaction){
    const el=document.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"] .msg`);
    if(el){el.classList.add("reaction-pop");setTimeout(()=>el.classList.remove("reaction-pop"),360)}

const chatReactionWords=["سبز","سید","رقیه","سگ","کث","آدامس","تراکتور","یگ","ممد","علف"];
let chatReactionTimer=null;
let lastChatReactionWord="";

function checkChatReactionWords(){
  const input=document.getElementById("messageInput");
  const box=document.getElementById("chatWordReaction");
  if(!input || !box)return;
  const value=String(input.value||"");
  const found=chatReactionWords.find(word=>value.includes(word));
  if(!found){
    lastChatReactionWord="";
    return;
  }
  if(found===lastChatReactionWord)return;
  lastChatReactionWord=found;
  box.classList.add("show");
  box.setAttribute("aria-hidden","false");
  clearTimeout(chatReactionTimer);
  chatReactionTimer=setTimeout(()=>{
    box.classList.remove("show");

}

function handleTypingInput(){

function stopTyping(){

function attachMessageGestures(){
  const box=document.getElementById("messages");
  if(!box)return;
  box.querySelectorAll(".msg-wrap").forEach(el=>{
    if(el.dataset.gestureBound)return;
    el.dataset.gestureBound="1";
    el.addEventListener("pointerdown",messagePointerDown,{passive:true});
    el.addEventListener("pointermove",messagePointerMove,{passive:true});
    el.addEventListener("pointerup",messagePointerUp,{passive:true});
    el.addEventListener("pointercancel",messagePointerCancel,{passive:true});
    el.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")messagePointerCancel(e)},{passive:true});
    el.addEventListener("contextmenu",e=>{e.preventDefault();openMessageActions(el.dataset.msgId) });
  });
}

function clearMessagePress(){
  clearTimeout(messagePressTimer);messagePressTimer=null;messagePressTarget=null;messageGesture=null;
}

function messagePointerDown(e){
  if(e.button!==undefined && e.button!==0)return;
  const el=e.currentTarget;
  const m=messageCache.get(String(el.dataset.msgId));
  if(!m)return;
  clearMessagePress();
  const point=e.touches?.[0]||e;
  messageGesture={startX:point.clientX,startY:point.clientY,lastX:point.clientX,active:true,moved:false};
  messagePressTarget=el;
  messagePressTimer=setTimeout(()=>{
    if(messageGesture?.active&&!messageGesture.moved){
      navigator.vibrate?.(12);
      openMessageActions(el.dataset.msgId);
      messageGesture.active=false;
    }
  },480);
}

function messagePointerMove(e){
  if(!messageGesture?.active)return;
  const point=e.touches?.[0]||e;
  messageGesture.lastX=point.clientX;
  const dx=point.clientX-messageGesture.startX;
  const dy=point.clientY-messageGesture.startY;
  if(Math.abs(dx)>10 || Math.abs(dy)>10)messageGesture.moved=true;
  if(Math.abs(dx)>16 && Math.abs(dx)>Math.abs(dy)*1.15){
    clearTimeout(messagePressTimer);
    if(Math.abs(dx)<100){
      messagePressTarget.classList.add("swiping");
      messagePressTarget.querySelector(".msg").style.transform=`translateX(${Math.max(-72,Math.min(72,dx))}px)`;
    }
  }
  if(Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.2){
    clearTimeout(messagePressTimer);
  }
}

function messagePointerUp(e){
  if(!messageGesture?.active)return;
  const el=messagePressTarget;
  const point=e.changedTouches?.[0]||e;
  const dx=point.clientX-messageGesture.startX;
  const dy=point.clientY-messageGesture.startY;
  clearTimeout(messagePressTimer);
  messagePressTimer=null;
  if(el){
    el.classList.remove("swiping");
    const bubble=el.querySelector(".msg");
    if(bubble){bubble.style.transform=""}
    if(Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.2){
      const m=messageCache.get(String(el.dataset.msgId));
      if(m)startReply(m);
    }
  }
  messageGesture.active=false;
}

function messagePointerCancel(){
  clearTimeout(messagePressTimer);messagePressTimer=null;
  if(messagePressTarget){messagePressTarget.classList.remove("swiping");const bubble=messagePressTarget.querySelector(".msg");if(bubble)bubble.style.transform=""}
  if(messageGesture)messageGesture.active=false;
}

function subscribeMessages(){
  const channelName=getChatChannelName();
  realtimeChannel=supabaseClient
    .channel(channelName)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const m=payload.new;
      const relevant=(m.sender_id===currentUser.id&&m.receiver_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.receiver_id===currentUser.id);
      if(!relevant)return;
      messageCache.set(String(m.id),m);
      cacheMessages([m]).catch(()=>{});
      if(hiddenMessageIds.has(String(m.id)))return;
      if(m.reply_to_id && !messageCache.has(String(m.reply_to_id))){
        const {data:original}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone").eq("id",m.reply_to_id).maybeSingle();
        if(original)messageCache.set(String(original.id),original);
      }
      const box=document.getElementById("messages");if(!box)return;
      box.querySelector(".empty")?.remove();
      if(document.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"]`))return;
      box.insertAdjacentHTML("beforeend",renderMessage(m));attachMessageGestures();box.scrollTop=box.scrollHeight;
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},payload=>{
      const m=payload.new;
      const relevant=(m.sender_id===currentUser.id&&m.receiver_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.receiver_id===currentUser.id);
      if(!relevant)return;
      messageCache.set(String(m.id),m);
      cacheMessages([m]).catch(()=>{});
      if(hiddenMessageIds.has(String(m.id)))return;
      refreshMessageElement(m);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.new;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      if(!m)return;
      messageReactionCache.set(id,r);
      refreshMessageElement(m,true);
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.new;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      if(!m)return;
      messageReactionCache.set(id,r);
      refreshMessageElement(m,true);
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.old;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      messageReactionCache.delete(id);
      if(m)refreshMessageElement(m);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"message_user_deletions"},payload=>{
      const d=payload.new;
      if(String(d.user_id)!==String(currentUser.id))return;
      const id=String(d.message_id);
      hiddenMessageIds.add(id);messageCache.delete(id);
      localCacheDelete("messages",messageCacheKey(currentUser.id,id)).catch(()=>{});
      document.querySelector(`[data-msg-id="${CSS.escape(id)}"]`)?.remove();ensureMessageEmptyState();
    })
    .subscribe(status=>console.log("Realtime:",status));
}

async function closeChatAndHome(){
  stopTyping();clearTypingState();clearMessagePress();closeMessageSheet();cancelMessageMode();
  if(realtimeChannel){try{await supabaseClient.removeChannel(realtimeChannel)}catch(e){}realtimeChannel=null}
  if(typingChannel){try{await supabaseClient.removeChannel(typingChannel)}catch(e){}typingChannel=null}
  chatPartner=null;messageCache.clear();hiddenMessageIds.clear();await renderHome();
}

async function sendMessage(e){
  if(e) e.preventDefault();
  const input=document.getElementById("messageInput");
  const button=document.getElementById("sendButton");
  if(!input || !chatPartner || !currentUser)return;

  const content=input.value.trim();
  if(!content)return;

  stopTyping();
  input.disabled=true;
  if(button) button.disabled=true;

  try{
    if(editingMessageId){
      const ok=await editMessage(editingMessageId,content);
      if(!ok)return;
      cancelMessageMode();
      input.focus();
      return;
    }

    // قبل از INSERT هر دو شناسه را از profiles تأیید می‌کنیم تا خطای FK به کاربر نمایش داده نشود.
    const {data:senderProfile,senderError}=await (async()=>{
      const r=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio").eq("id",currentUser.id).maybeSingle();
      return {data:r.data,senderError:r.error};
    })();
    if(senderError || !senderProfile?.id){
      sessionStorage.removeItem("love_profile");
      currentUser=null;
      alert("اطلاعات حساب با دیتابیس هماهنگ نیست. لطفاً یک‌بار خارج شوید و دوباره وارد شوید.");
      return;
    }

    const {data:receiverProfile, error:receiverError}=await supabaseClient
      .from("profiles")
      .select("id")
      .eq("id",chatPartner.id)
      .maybeSingle();
    if(receiverError || !receiverProfile?.id){
      alert("این مخاطب دیگر در فهرست کاربران وجود ندارد. فهرست گفتگوها را تازه‌سازی کنید.");
      return;
    }

    const payload={
      sender_id:senderProfile.id,
      receiver_id:receiverProfile.id,
      content:content
    };

    if(replyingToMessage?.id){
      payload.reply_to_id=replyingToMessage.id;
    }

    // مهم: ذخیره پیام را از SELECT ستون‌های اختیاری جدا می‌کنیم.
    // این باعث می‌شود نبودن edited_at/reply_to_id/... مانع ارسال پیام نشود.
    let result=await supabaseClient.from("messages").insert(payload).select("id,sender_id,receiver_id,content,created_at").single();

    // اگر ستون reply_to_id در دیتابیس وجود نداشت، پیام را بدون reply ذخیره کن.
    if(result.error && payload.reply_to_id && /reply_to_id|column .* does not exist/i.test(result.error.message||"")){
      const basicPayload={
        sender_id:currentUser.id,
        receiver_id:chatPartner.id,
        content:content
      };
      result=await supabaseClient.from("messages").insert(basicPayload).select("id,sender_id,receiver_id,content,created_at").single();
    }

    if(result.error){
      console.error("SEND MESSAGE ERROR:",result.error);
      alert("پیام ارسال نشد:\n"+(result.error.message||"خطای ناشناخته"));
      return;
    }

    const saved=result.data;
    const box=document.getElementById("messages");

    if(saved && box){
      messageCache.set(String(saved.id),saved);
      await cacheMessages([saved]);
      if(box.querySelector(".empty"))box.innerHTML="";
      if(!document.querySelector(`[data-msg-id="${CSS.escape(String(saved.id))}"]`)){
        box.insertAdjacentHTML("beforeend",renderMessage(saved));
        attachMessageGestures();
      }
      box.scrollTop=box.scrollHeight;
    }

    input.value="";
    replyingToMessage=null;
    document.getElementById("replyBar")?.classList.remove("show");
    const icon=document.getElementById("replyBarIcon");
    if(icon)icon.textContent="↩";
    input.focus();

    // The new message is already in IndexedDB and in the live cache; no full-history SELECT is needed.

  }catch(err){
    console.error("SEND MESSAGE UNEXPECTED ERROR:",err);
    alert("خطا در ارسال پیام:\n"+(err?.message||"خطای ناشناخته"));
  }finally{
    input.disabled=false;
    if(button)button.disabled=false;
  }
}

function navPulse(btn,action){
  const nav=btn?.closest(".bottom-nav");
  if(!nav)return;

  nav.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("jelly-target"));
  nav.classList.remove("jelly-pulse");
  void nav.offsetWidth;

  const rect=btn.getBoundingClientRect();
  const navRect=nav.getBoundingClientRect();
  const x=rect.left+rect.width/2-navRect.left;
  const size=Math.max(rect.width,rect.height);

  nav.style.setProperty("--jelly-x",`${x}px`);
  nav.style.setProperty("--jelly-left",`${x}px`);
  nav.style.setProperty("--jelly-size",`${size}px`);
  nav.classList.add("jelly-pulse");
  btn.classList.add("jelly-target");

  window.setTimeout(()=>{
    if(action==="chat")renderHome();
    else if(action==="game"||action==="book")soon();
    else if(action==="settings")renderSettings();
  },390);

  window.setTimeout(()=>{
    nav.classList.remove("jelly-pulse");
    btn.classList.remove("jelly-target");
  },450);
}

function soon(){alert("این بخش به‌زودی فعال می‌شود ♡")}

async function logout(){
  stopTyping();
  clearTypingState();
  clearMessagePress();
  closeMessageSheet();
  if(realtimeChannel){
    await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }
  if(homeInboxChannel){
    await supabaseClient.removeChannel(homeInboxChannel);
    homeInboxChannel=null;
  }
  homeTypingTimers.forEach(t=>clearTimeout(t));
  homeTypingTimers.clear();
  currentUser=null;
  chatPartner=null;
  messageCache.clear();
  hiddenMessageIds.clear();
  editingMessageId=null;
  replyingToMessage=null;
  sessionStorage.removeItem("love_profile");
  document.getElementById("app").innerHTML="";
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value="";
  setLoginError("");
  replayLoginLogo();
}

(async()=>{
  const saved=sessionStorage.getItem("love_profile");
  if(saved){
    try{
      const profile=JSON.parse(saved);
      if(profile?.id){
        currentUser={profile,id:profile.id};
        await loadApp();
        return;
      }
    }catch(e){}
  }
  document.getElementById("loginScreen").classList.remove("hidden");
})();
