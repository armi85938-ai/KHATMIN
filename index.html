async function logout(){
  stopTyping();
  clearTypingState();
  clearMessagePress();
  closeMessageSheet();
  if(realtimeChannel){
    await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }
  if(notificationChannel){await supabaseClient.removeChannel(notificationChannel);notificationChannel=null;}
  if(homeInboxChannel){
    await supabaseClient.removeChannel(homeInboxChannel);
    homeInboxChannel=null;
  }
  homeTypingTimers.forEach(t=>clearTimeout(t));
  homeTypingTimers.clear();
  currentUser=null;
  chatPartner=null;
  messageCache.clear();
  hiddenMessageIds.clear();
  editingMessageId=null;
  replyingToMessage=null;
  sessionStorage.removeItem("love_profile");
  localStorage.removeItem("khatmin_remembered_profile");
  document.getElementById("app").innerHTML="";
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value="";
  setLoginError("");
  replayLoginLogo();
}

(async()=>{
  // Prefer the current tab session; if the browser was reopened, restore
  // the last successful profile from persistent browser storage.
  const saved=sessionStorage.getItem("love_profile")||localStorage.getItem("khatmin_remembered_profile");
  if(saved){
    try{
      const profile=JSON.parse(saved);
      if(profile?.id){
        currentUser={profile,id:profile.id};
        // Restore the tab session too, so navigation inside this tab remains fast.
        sessionStorage.setItem("love_profile",JSON.stringify(profile));
        await loadApp();
        return;
      }
    }catch(e){
      sessionStorage.removeItem("love_profile");
      localStorage.removeItem("khatmin_remembered_profile");
    }
  }
  document.getElementById("loginScreen").classList.remove("hidden");
})();
</script>

<style>
/* ===== Tiny clear water drop tab transition ===== */
.nav-liquid-flight{
  position:fixed;
  z-index:99999;
  width:20px;
  height:26px;
  border-radius:50% 50% 55% 55% / 46% 46% 70% 70%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  overflow:visible;
  background:
    radial-gradient(circle at 34% 23%,rgba(255,255,255,.92) 0 8%,rgba(255,255,255,.32) 19%,transparent 36%),
    linear-gradient(145deg,rgba(255,255,255,.30),rgba(183,230,255,.10) 48%,rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    inset 3px 4px 7px rgba(255,255,255,.34),
    inset -3px -5px 7px rgba(65,155,210,.10),
    0 5px 14px rgba(130,210,255,.16);
  backdrop-filter:blur(4px) saturate(160%);
  -webkit-backdrop-filter:blur(4px) saturate(160%);
  will-change:left,top,transform,opacity;
}
.nav-liquid-flight::before{
  content:"";
  position:absolute;
  width:6px;height:9px;
  left:4px;top:4px;
  border-radius:70% 50% 70% 50%;
  background:rgba(255,255,255,.72);
  filter:blur(1px);
  transform:rotate(-20deg);
}
.nav-liquid-flight::after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:8px;height:3px;
  border-radius:50%;
  border:1px solid rgba(215,247,255,.46);
  transform:translate(-50%,-50%) scale(.4);
  opacity:0;
}
.nav-liquid-flight .flight-drop{
  position:absolute;
  left:50%;top:-5px;
  width:5px;height:8px;
  border-radius:60% 60% 70% 70%;
  background:rgba(255,255,255,.20);
  filter:blur(.4px);
  transform:translateX(-50%);
}
.nav-liquid-flight .flight-splash{
  position:absolute;
  left:50%;top:50%;
  width:3px;height:9px;
  border-radius:70% 70% 55% 55%;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(165,225,255,.18));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 1px 5px rgba(115,205,245,.18);
  opacity:0;
  transform:translate(-50%,-50%) scale(.2);
  transform-origin:50% 100%;
}
.nav-liquid-flight.is-impact .flight-ring{
  animation:flightImpactRing .48s cubic-bezier(.08,.72,.18,1) forwards;
}
.nav-liquid-flight.is-impact::after{
  animation:flightSurface .46s cubic-bezier(.08,.72,.18,1) forwards;
}
.nav-liquid-flight.is-impact .flight-splash{
  animation:flightSplash .48s cubic-bezier(.12,.72,.2,1) forwards;
}
.nav-liquid-flight.is-impact .splash-a{--sx:-18px;--sy:-13px;--rot:-42deg;animation-delay:0ms}
.nav-liquid-flight.is-impact .splash-b{--sx:18px;--sy:-12px;--rot:42deg;animation-delay:.025s}
.nav-liquid-flight.is-impact .splash-c{--sx:-24px;--sy:2px;--rot:-74deg;animation-delay:.04s}
.nav-liquid-flight.is-impact .splash-d{--sx:24px;--sy:3px;--rot:74deg;animation-delay:.055s}
.nav-liquid-flight.is-impact .splash-e{--sx:0px;--sy:-19px;--rot:0deg;animation-delay:.015s}
@keyframes flightImpactRing{
  0%{transform:translate(-50%,-50%) scale(.18,.18);opacity:.82}
  30%{opacity:.62}
  100%{transform:translate(-50%,-50%) scale(4.2,1.22);opacity:0}
}
@keyframes flightSurface{
  0%{transform:translate(-50%,-50%) scale(.25,.25);opacity:.78}
  32%{transform:translate(-50%,-50%) scale(1.35,.5);opacity:.48}
  100%{transform:translate(-50%,-50%) scale(4.8,1.25);opacity:0}
}
@keyframes flightSplash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0deg)}
  12%{opacity:.9}
  48%{opacity:.66;transform:translate(calc(-50% + var(--sx)*.62),calc(-50% + var(--sy)*.62)) scale(.9) rotate(var(--rot))}
  100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(.34) rotate(var(--rot))}
}
@media(prefers-reduced-motion:reduce){
  .nav-liquid-flight{animation-duration:.01ms !important}
}

</style>
