<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}

html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:#fff7fb;color:#4a3945}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(430px,100%);padding:28px 22px;border:1px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(255,255,255,.78);box-shadow:0 20px 60px rgba(170,110,145,.16);backdrop-filter:blur(20px)}
.logo{width:72px;height:72px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdbe9,#eadcff);font-size:calc(32px * var(--text-scale,1));box-shadow:0 10px 25px rgba(180,120,160,.15)}
h1{font-size:calc(25px * var(--text-scale,1));text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#927c89;margin:0 0 25px;font-size:calc(13px * var(--text-scale,1))}
.field{margin-bottom:14px}
.field label{display:block;font-size:calc(12px * var(--text-scale,1));margin:0 5px 7px;color:#806a77}
.field input{width:100%;height:50px;border:1px solid #eadce4;border-radius:16px;background:#fff;padding:0 15px;outline:none;transition:.2s}
.field input:focus{border-color:#d7a9c0;box-shadow:0 0 0 4px rgba(215,169,192,.13)}
.login-btn{width:100%;height:52px;border:0;border-radius:17px;color:white;background:linear-gradient(135deg,#d88eaf,#b69adf);box-shadow:0 12px 25px rgba(180,120,160,.22);font-weight:bold}
.login-btn:disabled{opacity:.65;cursor:wait}
.error{min-height:22px;margin:12px 4px 0;color:#c45b78;font-size:calc(12px * var(--text-scale,1));text-align:center;line-height:1.7}
.hint{text-align:center;color:#a28e9a;font-size:calc(11px * var(--text-scale,1));margin:12px 0 0}

.app{min-height:100vh;padding-bottom:105px}
.top{padding:25px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.top-divider{height:1px;margin:0 18px;background:linear-gradient(90deg,transparent,#eadde5 18%,#eadde5 82%,transparent);opacity:.9}
.brand-title{font-weight:bold;font-size:calc(20px * var(--text-scale,1))}
.brand-sub{font-size:calc(11px * var(--text-scale,1));color:#a38d99;margin-top:5px}
.icon-btn{width:43px;height:43px;border:0;border-radius:15px;background:rgba(255,255,255,.8);box-shadow:0 8px 25px rgba(170,110,145,.1);display:grid;place-items:center}
.icon-btn svg{width:21px;height:21px;stroke:#826474}
.content{padding:8px 15px}
.section-title{font-size:calc(14px * var(--text-scale,1));margin:13px 4px}
.chat-list{display:grid;gap:10px}
.chat-card{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #f0e4eb;background:rgba(255,255,255,.8);border-radius:21px;padding:13px;text-align:right;box-shadow:0 7px 22px rgba(170,110,145,.07)}
.avatar{width:51px;height:51px;border-radius:18px;background:linear-gradient(135deg,#ffe0ec,#e9defc);display:grid;place-items:center;font-weight:bold;color:#806474;flex:none}
.chat-avatar-image{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}.chat-profile .avatar{overflow:hidden}.chat-profile .avatar img{width:100%;height:100%;display:block;object-fit:cover}\n.chat-main{min-width:0;flex:1}
.chat-name{font-weight:bold;font-size:calc(14px * var(--text-scale,1))}
.chat-last{font-size:calc(11px * var(--text-scale,1));color:#a18d99;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-last.typing-state{color:#fff;font-weight:600}
.chat-time{font-size:calc(10px * var(--text-scale,1));color:#b19ca7}
.empty{padding:35px 15px;text-align:center;color:#a08d98;font-size:calc(13px * var(--text-scale,1))}

.bottom-nav{position:fixed;z-index:20;left:50%;bottom:17px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));height:68px;border:1px solid rgba(255,255,255,.75);border-radius:24px;background:rgba(255,255,255,.66);backdrop-filter:blur(20px);box-shadow:0 16px 45px rgba(130,90,120,.16);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.nav-btn{height:50px;border:0;background:transparent;display:grid;place-items:center;border-radius:18px}
.nav-btn.active{background:rgba(232,207,225,.55)}
.nav-btn svg{width:23px;height:23px;stroke:#8c7182}

.chat-view{min-height:100vh;display:flex;flex-direction:column}
.chat-header{height:74px;padding:12px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0e4eb;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
.chat-title{font-weight:bold;font-size:calc(15px * var(--text-scale,1))}
.chat-body{flex:1;padding:18px 13px 95px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 12px;border-radius:17px;font-size:calc(13px * var(--text-scale,1));line-height:1.7;word-break:break-word;box-shadow:0 4px 14px rgba(160,110,140,.06)}
.msg.mine{align-self:flex-start;background:#ecdff5;border-bottom-left-radius:5px}
.msg.theirs{align-self:flex-end;background:#fff;border:1px solid #f1e6ed;border-bottom-right-radius:5px}
.msg-time{font-size:calc(9px * var(--text-scale,1));color:#ad99a5;margin-top:3px}
.composer{position:fixed;z-index:10;left:50%;bottom:17px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;gap:8px;padding:8px;border-radius:22px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(130,90,120,.15)}
.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 10px;color:#4a3945}
.send{width:44px;height:44px;border:0;border-radius:16px;background:#d79bb8;color:#fff;display:grid;place-items:center}
.send svg{width:20px;height:20px;stroke:white}
.loading{opacity:.7}

/* ===== KHATMIN visual upgrade ===== */
.brand-title{
  font-family:"Caveat",cursive;
  font-size:calc(32px * var(--text-scale,1));
  font-weight:700;
  letter-spacing:.4px;
  line-height:1;
  background:linear-gradient(120deg,#b9789c,#8c79b7,#c487a7);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.brand-sub{margin-top:7px}
.section-title{
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:calc(15px * var(--text-scale,1));
  font-weight:700;
  color:#66515f;
  margin:17px 4px 13px;
}
.section-title:before{
  content:"";
  width:7px;height:7px;
  border-radius:50%;
  background:#d89db9;
  box-shadow:0 0 0 6px rgba(216,157,185,.12);
}
.chat-list{gap:12px}
.chat-card{
  position:relative;
  overflow:hidden;
  min-height:79px;
  border:1px solid rgba(255,255,255,.92);
  background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,244,249,.78));
  border-radius:25px;
  padding:13px 14px;
  box-shadow:0 12px 30px rgba(151,104,132,.10);
  transition:transform .18s ease,box-shadow .18s ease;
}
.chat-card:before{
  content:"";
  position:absolute;
  width:90px;height:90px;
  left:-35px;bottom:-55px;
  border-radius:50%;
  background:rgba(226,198,232,.24);
}
.chat-card:after{
  content:"";
  position:absolute;
  width:55px;height:55px;
  right:-20px;top:-25px;
  border-radius:50%;
  background:rgba(255,218,231,.30);
}
.chat-card:active{transform:scale(.985)}
.avatar{
  position:relative;
  z-index:1;
  width:54px;height:54px;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe4ef 0%,#eadffb 100%);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 7px 16px rgba(150,105,140,.13);
  color:#806274;
  font-size:calc(18px * var(--text-scale,1));
}
.chat-main,.chat-time{position:relative;z-index:1}
.chat-name{font-size:calc(14px * var(--text-scale,1));color:#564451}
.chat-last{
  font-size:calc(11px * var(--text-scale,1));
  color:#9a8792;
  margin-top:6px;
}
.chat-time{font-size:calc(9px * var(--text-scale,1));color:#ad98a5;align-self:flex-start;margin-top:4px}

/* chat screen */
.chat-header{
  height:78px;
  border-bottom:1px solid rgba(235,220,229,.7);
  box-shadow:0 5px 20px rgba(150,105,135,.05);
}
.chat-title{
  font-size:calc(15px * var(--text-scale,1));
  color:#55434f;
}
.chat-body{
  position:relative;
  background:
    radial-gradient(circle at 15% 12%,rgba(238,213,232,.22) 0 2px,transparent 3px),
    radial-gradient(circle at 85% 35%,rgba(248,207,223,.25) 0 2px,transparent 3px),
    linear-gradient(180deg,#fffafd 0%,#fff7fb 100%);
}
.chat-body:before{
  content:"KHATMIN";
  position:fixed;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%) rotate(-8deg);
  font-family:"Caveat",cursive;
  font-size:calc(58px * var(--text-scale,1));
  font-weight:700;
  color:rgba(195,153,179,.055);
  pointer-events:none;
}
.msg{
  position:relative;
  max-width:80%;
  padding:10px 14px 8px;
  border-radius:20px;
  font-size:calc(13px * var(--text-scale,1));
  line-height:1.8;
  box-shadow:0 7px 18px rgba(143,103,126,.08);
  animation:msgIn .18s ease-out;
}
.msg.mine{
  align-self:flex-start;
  color:#5b4654;
  background:linear-gradient(135deg,#eadff7 0%,#f2e3ef 100%);
  border:1px solid rgba(255,255,255,.8);
  border-bottom-left-radius:6px;
}
.msg.mine:after{
  content:"";
  position:absolute;
  left:-5px;
  bottom:1px;
  width:12px;height:12px;
  background:#eadff7;
  clip-path:polygon(100% 0,100% 100%,0 100%);
}
.msg.theirs{
  align-self:flex-end;
  color:#594650;
  background:linear-gradient(135deg,#fff 0%,#fff8fb 100%);
  border:1px solid #f1e2ea;
  border-bottom-right-radius:6px;
}
.msg.theirs:after{
  content:"";
  position:absolute;
  right:-5px;
  bottom:1px;
  width:12px;height:12px;
  background:#fff8fb;
  clip-path:polygon(0 0,100% 100%,0 100%);
}
.msg-time{
  font-size:calc(8px * var(--text-scale,1));
  color:#ad98a5;
  margin-top:2px;
}
.composer{
  border-radius:25px;
  padding:7px 7px 7px 11px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(235,218,229,.85);
  box-shadow:0 15px 42px rgba(128,87,115,.16);
}
.composer input{
  font-size:calc(13px * var(--text-scale,1));
}
.composer input::placeholder{color:#b3a0aa}
.send{
  width:45px;height:45px;
  border-radius:18px;
  background:linear-gradient(135deg,#d69ab8,#ad91d2);
  box-shadow:0 7px 16px rgba(170,125,166,.22);
  transition:transform .16s ease;
}
.send:active{transform:scale(.93)}
.composer-action{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.58);color:#24232a;cursor:pointer;transition:transform .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.composer-action svg{width:22px;height:22px;transition:transform .16s ease,opacity .16s ease}
.composer-action:hover{background:rgba(255,255,255,.82)}
.composer-action:active{transform:scale(.92)}
.composer-action.is-voice{background:rgba(255,255,255,.66)}
.composer-action.is-send{background:#fff;color:#08090c}
.composer-action.voice-recording{background:#fff;color:#0a0b0d;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.composer-action.voice-recording svg{transform:scale(1.02)}
.voice-recorder-ui{min-width:0;flex:1;display:none;align-items:center;justify-content:flex-end;gap:9px;padding:0 10px;direction:rtl;user-select:none}
.voice-recorder-ui.show{display:flex}
.voice-recorder-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:#ff2638;box-shadow:0 0 0 0 rgba(255,38,56,.38);animation:voiceDotBlink .9s ease-in-out infinite}
.voice-recorder-time{min-width:48px;color:#fff;font-size:calc(13px * var(--text-scale,1));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-align:center;direction:ltr}
.voice-recorder-label{color:#aeb0b8;font-size:calc(11px * var(--text-scale,1));white-space:nowrap}
@keyframes voiceDotBlink{0%,100%{opacity:.35;transform:scale(.82);box-shadow:0 0 0 0 rgba(255,38,56,.34)}50%{opacity:1;transform:scale(1);box-shadow:0 0 0 6px rgba(255,38,56,.08)}}
.composer.recording .voice-recorder-ui{display:flex}
.composer.recording #messageInput{display:none}

@keyframes msgIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}


/* ===== KHATMIN DARK + WHITE / LTR REDESIGN ===== */
html,body{
  direction:ltr;
  background:#08090c;
  color:#f5f5f7;
}
body{
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.055),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.035),transparent 25%),
    #08090c;
}
.screen{direction:ltr}
.login-card{
  background:rgba(16,17,21,.92);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 25px 80px rgba(0,0,0,.48);
}
.logo{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  background:transparent;
  border-radius:30px;
  box-shadow:none;
  overflow:visible;
}
.logo img{
  position:relative;
  z-index:2;
  width:92px;
  height:92px;
  object-fit:contain;
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  clip-path:inset(100% 0 0 0);
  animation:logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards;
}
.logo:before{
  content:"";
  position:absolute;
  z-index:3;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px 5px rgba(255,255,255,.8);
  left:12px;
  top:96px;
  opacity:0;
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
  pointer-events:none;
}
.logo.replay:before{
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
}
.logo.replay:after{
  animation:logoAura 2.2s ease-out 1.25s forwards;
}
.logo:after{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:34px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 66%);
  filter:blur(5px);
  opacity:0;
  animation:logoAura 2.2s ease-out 1.25s forwards;
  pointer-events:none;
}
.login-card h1{color:#fff}
.subtitle{display:none}
.field label,.hint{color:#9a9ba3}
.field label{
  text-align:center;
  font-size:calc(13px * var(--text-scale,1));
  letter-spacing:.2px;
}
.field input{
  background:#0e1014;
  color:#fff;
  border:1px solid #282a30;
  text-align:center;
}
.field input::placeholder{text-align:center}
.login-btn{
  text-transform:uppercase;
  letter-spacing:1.2px;
}
@keyframes logoDraw{
  0%{clip-path:inset(100% 0 0 0);transform:scale(.88) rotate(-4deg);opacity:0}
  22%{opacity:1}
  70%{clip-path:inset(20% 0 0 0);transform:scale(1.015) rotate(1deg)}
  100%{clip-path:inset(0 0 0 0);transform:scale(1) rotate(0);opacity:1}
}
@keyframes logoPen{
  0%{opacity:0;left:12px;top:96px;transform:scale(.5)}
  12%{opacity:1}
  45%{left:52px;top:61px}
  72%{left:80px;top:28px}
  100%{left:96px;top:92px;opacity:0;transform:scale(.2)}
}
@keyframes logoGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  45%{filter:drop-shadow(0 0 15px rgba(255,255,255,.34))}
  100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.08))}
}
@keyframes logoAura{
  0%{opacity:0;transform:scale(.7)}
  45%{opacity:1;transform:scale(1.05)}
  100%{opacity:.35;transform:scale(1)}
}
.field input::placeholder{color:#686a73}
.field input:focus{
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
}
.login-btn{
  color:#0a0b0d;
  background:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.error{color:#ff8fa3}

/* ===== Floating Jelly Navigation — isolated enhancement ===== */
.bottom-nav{
  position:fixed;

  left:50%;
  bottom:17px;
  transform:translateX(-50%);
  width:min(390px,calc(100% - 28px));

  padding:7px !important;

  align-items:center !important;
  gap:4px !important;

  isolation:isolate;
  border:0;
  border-radius:30px;
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:none;
}
.bottom-nav::before{
  content:"";
  position:absolute;
  z-index:0;
  inset:0;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035)),rgba(13,14,18,.80);

  -webkit-backdrop-filter:blur(22px) saturate(145%);
  box-shadow:0 20px 55px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.22);
  transition:opacity .25s ease;
}
.bottom-nav::after{
  content:"";
  position:absolute;
  z-index:1;
  left:var(--nav-x,50%);
  top:50%;
  width:68px;
  height:50px;
  transform:translate(-50%,-50%);
  border-radius:17px;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(115deg,transparent 8%,rgba(255,255,255,.13) 42%,rgba(255,255,255,.34) 50%,rgba(255,255,255,.08) 58%,transparent 92%),
    linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 10px 28px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.34),
    inset 0 -1px 0 rgba(255,255,255,.045);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  will-change:left,transform,opacity,box-shadow;
}

  0%{left:var(--nav-from-x,var(--nav-x,50%));opacity:.72;transform:translate(-50%,-50%) scale(.94)}
  100%{left:var(--nav-x,50%);opacity:1;transform:translate(-50%,-50%) scale(1)}
}

  z-index:1;
  overflow:visible !important;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav .nav-btn::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:50%;
  top:50%;
  width:52px;

.bottom-nav .nav-btn:hover{transform:translateY(-2px);color:#fff !important}

/* Water-drop page transition */
.water-transition{
  position:fixed;
  inset:0;
  z-index:99999;
  pointer-events:none;
  overflow:hidden;
  opacity:1;
}
.water-transition__veil{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at var(--water-x) var(--water-y),rgba(170,220,255,.075),transparent 18%,rgba(0,0,0,0) 48%);
  opacity:0;
  animation:waterVeil .72s ease-out forwards;
}
.water-transition__drop{
  position:absolute;
  left:var(--water-x);
  top:-92px;
  width:32px;
  height:48px;
  transform:translateX(-50%) rotate(45deg);
  border-radius:58% 42% 62% 38% / 58% 48% 52% 42%;
  background:linear-gradient(135deg,rgba(255,255,255,.82) 0%,rgba(215,244,255,.42) 24%,rgba(110,195,235,.20) 55%,rgba(255,255,255,.12) 78%,rgba(255,255,255,.42) 100%);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:inset -5px -7px 10px rgba(52,154,207,.10),inset 5px 4px 8px rgba(255,255,255,.52),0 12px 24px rgba(75,176,224,.18);
  backdrop-filter:blur(3px) saturate(145%);
  -webkit-backdrop-filter:blur(3px) saturate(145%);
  filter:url(#waterGlass);
  opacity:0;
  animation:waterDropFall .58s cubic-bezier(.18,.76,.22,1) forwards;
}
.water-transition__drop::before{
  content:"";
  position:absolute;
  width:7px;
  height:16px;
  left:8px;
  top:7px;
  border-radius:70% 45% 70% 45%;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,0));
  transform:rotate(-8deg);
  filter:blur(.2px);
}
.water-transition__drop::after{
  content:"";
  position:absolute;
  width:9px;
  height:5px;
  right:3px;
  bottom:8px;
  border-radius:50%;
  background:rgba(255,255,255,.28);
  filter:blur(2px);
}
.water-transition__impact{
  position:absolute;
  left:var(--water-x);
  top:var(--water-y);
  width:10px;
  height:10px;
  transform:translate(-50%,-50%) scale(.1);
  border-radius:50%;
  border:1px solid rgba(210,247,255,.72);
  box-shadow:0 0 18px rgba(135,220,255,.28),inset 0 0 8px rgba(255,255,255,.32);
  opacity:0;
  animation:waterImpact .7s .48s cubic-bezier(.16,.75,.22,1) forwards;
}
.water-transition__ripple,
.water-transition__ripple::before,
.water-transition__ripple::after{
  position:absolute;
  left:var(--water-x);
  top:var(--water-y);
  width:26px;
  height:9px;
  border-radius:50%;
  border:1px solid rgba(190,239,255,.62);
  box-shadow:0 0 15px rgba(101,198,236,.16),inset 0 0 7px rgba(255,255,255,.12);
  transform:translate(-50%,-50%) scale(.15);
  opacity:0;
  content:"";
}
.water-transition__ripple{animation:waterRipple .82s .53s cubic-bezier(.1,.68,.18,1) forwards}
.water-transition__ripple::before{animation:waterRipple .82s .11s cubic-bezier(.1,.68,.18,1) forwards}
.water-transition__ripple::after{animation:waterRipple .82s .22s cubic-bezier(.1,.68,.18,1) forwards}
@keyframes waterDropFall{
  0%{top:-92px;opacity:0;transform:translateX(-50%) rotate(45deg) scale(.72)}

<style id="khatmin-heart-float-actions">
/* ===== Smooth floating actions from the chat heart ===== */
.chat-header > .chat-heart-button{
  overflow:visible !important;
  z-index:40 !important;
  position:relative !important;
}
.chat-heart-actions{
  position:absolute;
  top:6px;
  left:50%;
  width:48px;
  height:112px;
  transform:translateX(-50%);
  pointer-events:none;
  opacity:0;
  visibility:hidden;
}
.chat-heart-button.heart-actions-open .chat-heart-actions{
  pointer-events:auto;
}
.chat-heart-action{
  position:absolute;
  top:0;
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--theme-accent,#6f46bd);
  border:1px solid rgba(255,255,255,.48);
  background:
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.58),transparent 32%),
    linear-gradient(145deg,rgba(255,255,255,.54),rgba(255,255,255,.16) 58%,rgba(220,205,255,.20));
  box-shadow:
    0 12px 30px rgba(70,45,120,.16),
    inset 0 1px 0 rgba(255,255,255,.78),
    inset 0 -1px 0 rgba(255,255,255,.22);
  backdrop-filter:blur(20px) saturate(175%);
  -webkit-backdrop-filter:blur(20px) saturate(175%);
  background:
    radial-gradient(circle at 27% 20%,rgba(255,255,255,.72),transparent 28%),
    radial-gradient(circle at 78% 82%,rgba(195,177,255,.22),transparent 42%),
    linear-gradient(145deg,rgba(255,255,255,.62),rgba(255,255,255,.18) 58%,rgba(220,205,255,.24));
  box-shadow:
    0 14px 34px rgba(70,45,120,.17),
    inset 0 1px 0 rgba(255,255,255,.88),
    inset 0 -2px 0 rgba(255,255,255,.18),
    0 0 0 1px rgba(255,255,255,.12);
  opacity:0;
  transform:translate3d(0,-10px,0) scale(.52);
  will-change:transform,opacity,border-radius;
}
.chat-heart-button.heart-actions-open .chat-heart-action{
  animation-timing-function:cubic-bezier(.16,1,.3,1);
}
.chat-heart-button.heart-actions-open .chat-heart-pin{
  animation:heartPinFloat 460ms cubic-bezier(.18,1.28,.24,1) 0ms 1 both;
}
.chat-heart-button.heart-actions-open .chat-heart-bell{
  animation:heartBellFloat 500ms cubic-bezier(.18,1.28,.24,1) 35ms 1 both;
}
.chat-heart-pin{left:0;top:0}
.chat-heart-bell{left:0;top:0}
.chat-heart-action svg{
  width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 4px rgba(70,45,120,.12));
}
.chat-heart-actions::before,.chat-heart-actions::after{
  content:"";
  position:absolute;
  top:-4px;
  width:8px;height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  filter:blur(3px);
  opacity:0;
}
.chat-heart-actions::before{left:20px}
.chat-heart-actions::after{left:20px}
.chat-heart-button.heart-actions-open .chat-heart-actions{
  opacity:1;visibility:visible;
}
.chat-heart-button.heart-actions-open .chat-heart-actions::before{
  animation:heartSpark 560ms ease-out forwards;
}
.chat-heart-button.heart-actions-open .chat-heart-actions::after{
  animation:heartSpark 620ms 55ms ease-out forwards;
}
@keyframes heartPinFloat{
  0%{opacity:0;transform:translate3d(0,-8px,0) scale(.42);border-radius:48% 52% 50% 50%}
  28%{opacity:1;transform:translate3d(0,12px,0) scale(1.10);border-radius:45% 55% 54% 46%}
  55%{transform:translate3d(0,43px,0) scale(.96);border-radius:55% 45% 47% 53%}
  78%{transform:translate3d(0,58px,0) scale(1.025);border-radius:49% 51% 53% 47%}
  100%{opacity:1;transform:translate3d(0,54px,0) scale(1);border-radius:50%}
}
@keyframes heartBellFloat{
  0%{opacity:0;transform:translate3d(0,-8px,0) scale(.42);border-radius:48% 52% 50% 50%}
  28%{opacity:1;transform:translate3d(0,12px,0) scale(1.10);border-radius:45% 55% 54% 46%}
  55%{transform:translate3d(0,78px,0) scale(.96);border-radius:55% 45% 47% 53%}
  80%{transform:translate3d(0,112px,0) scale(1.025);border-radius:49% 51% 53% 47%}
  100%{opacity:1;transform:translate3d(0,108px,0) scale(1);border-radius:50%}
}
@keyframes heartSpark{
  0%{opacity:0;transform:translateY(0) scale(.4)}
  45%{opacity:.75;transform:translateY(20px) scale(1)}
  100%{opacity:0;transform:translateY(48px) scale(.2)}
}
@media(max-width:520px){
  .chat-heart-actions{top:6px;width:48px;height:116px}
  .chat-heart-action{width:48px;height:48px}
  .chat-heart-pin{left:0;top:0}.chat-heart-bell{left:0;top:0}
  .chat-heart-action svg{width:21px;height:21px}
}
</style>

/* ===== Fast local cache =====
   The browser keeps previously loaded contacts/messages in IndexedDB.
   Supabase remains the source of truth; after the first sync only newer
   messages are requested in the background. */
const LOCAL_CACHE_DB="khatmin-local-cache-v1";
let localCacheDBPromise=null;
function openLocalCache(){
  if(localCacheDBPromise)return localCacheDBPromise;
  localCacheDBPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(LOCAL_CACHE_DB,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains("profiles"))db.createObjectStore("profiles",{keyPath:"key"});
        if(!db.objectStoreNames.contains("messages"))db.createObjectStore("messages",{keyPath:"key"});
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e)}
  });
  return localCacheDBPromise;
}
async function localCacheGet(store,key){
  try{const db=await openLocalCache();return await new Promise((resolve,reject)=>{const r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}
}
async function localCacheGetAll(store,prefix){
  try{const db=await openLocalCache();return await new Promise((resolve,reject)=>{const out=[];const r=db.transaction(store,"readonly").objectStore(store).openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return resolve(out);if(!prefix||String(c.key).startsWith(prefix))out.push(c.value);c.continue()};r.onerror=()=>reject(r.error)})}catch(e){return []}
}
async function localCachePutAll(store,rows){
  if(!rows?.length)return;
  try{const db=await openLocalCache();await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");const os=tx.objectStore(store);rows.forEach(x=>os.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){console.warn("LOCAL CACHE WRITE:",e)}
}
async function localCacheDelete(store,key){try{const db=await openLocalCache();await new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}}
function profileCacheKey(userId,partnerId){return `${String(userId)}:${String(partnerId)}`}
function messageCacheKey(userId,messageId){return `${String(userId)}:${String(messageId)}`}
async function getCachedProfiles(){return (await localCacheGetAll("profiles",`${currentUser.id}:`)).map(x=>x.profile).filter(Boolean)}
async function cacheProfiles(profiles){await localCachePutAll("profiles",(profiles||[]).map(profile=>({key:profileCacheKey(currentUser.id,profile.id),profile}))) }
async function getCachedMessages(partnerId){return (await localCacheGetAll("messages",`${currentUser.id}:${String(partnerId)}:`)).map(x=>x.message).filter(Boolean).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
async function cacheMessages(messages){await localCachePutAll("messages",(messages||[]).filter(Boolean).map(message=>({key:messageCacheKey(currentUser.id,message.id).replace(`${currentUser.id}:`,`${currentUser.id}:${String(message.sender_id===currentUser.id?message.receiver_id:message.sender_id)}:`),message}))) }
async function getCachedAllMessages(){return (await localCacheGetAll("messages",`${currentUser.id}:`)).map(x=>x.message).filter(Boolean)}
function mergeMessagesIntoCache(list,extra){
  const map=new Map((list||[]).map(m=>[String(m.id),m]));
  (extra||[]).forEach(m=>map.set(String(m.id),m));
  return Array.from(map.values()).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function faTime(v){
  try{return new Intl.DateTimeFormat("fa-IR",{hour:"2-digit",minute:"2-digit"}).format(new Date(v))}
  catch{return ""}
}

function setLoginError(msg){
  document.getElementById("loginError").textContent=msg||"";
}

function replayLoginLogo(){
  const logo=document.getElementById("loginLogo");
  if(!logo) return;
  const img=logo.querySelector("img");
  if(!img) return;
  img.style.animation="none";
  logo.style.setProperty("--logo-replay","none");
  void img.offsetWidth;
  img.style.animation="logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards";
  logo.classList.remove("logo-replay");
  void logo.offsetWidth;
  logo.classList.add("logo-replay");
}

async function login(username,password){
  const u=username.trim();
  if(!u || !password) throw new Error("نام کاربری و رمز عبور را وارد کنید.");

  const {data,error}=await supabaseClient.rpc("login_with_username",{
    p_username:u,
    p_password:password
  });

  if(error){
    console.error("LOGIN RPC ERROR:",error);
    throw new Error("خطای اتصال به دیتابیس: "+(error.message||"RPC error"));
  }

  if(!data || !data.length){
    throw new Error("نام کاربری یا رمز عبور اشتباه است.");
  }

  return data[0];
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("loginBtn");
  setLoginError("");
  btn.disabled=true;
  btn.classList.add("loading");
  btn.textContent="در حال ورود...";

  try{
    let profile=await login(
      document.getElementById("username").value,
      document.getElementById("password").value
    );

    // Always resolve the logged-in user from the real profiles table.
    // This prevents an old/mismatched RPC id from breaking contacts and messages.
    try{
      const loginUsername=String(profile?.username||document.getElementById("username").value||"").trim();
      if(loginUsername){
        const {data:canonicalProfile}=await supabaseClient
          .from("profiles")
          .select("id,username,display_name,avatar_url,bio")
          .eq("username",loginUsername)
          .maybeSingle();
        if(canonicalProfile?.id){ profile={...profile,...canonicalProfile}; }
      }
    }catch(resolveError){
      console.warn("Could not resolve canonical profile; using login profile:",resolveError);
    }

    currentUser={profile,id:profile.id};
    // Keep the last successful login on this browser so a normal reload/reopen
    // does not force the user to enter the password again. Never store the password.
    const savedProfile=JSON.stringify(profile);
    sessionStorage.setItem("love_profile",savedProfile);
    localStorage.setItem("khatmin_remembered_profile",savedProfile);
    await loadApp();
  }catch(err){
    console.error(err);
    setLoginError(err.message||"ورود انجام نشد.");
  }finally{
    btn.disabled=false;
    btn.classList.remove("loading");
    btn.textContent="LOGIN";
  }
});

async function loadApp(){
  // قبل از باز کردن پیام‌رسان، شناسه کاربر را با رکورد واقعی profiles هماهنگ می‌کنیم.
  // این کار نشست‌های قدیمی را که باعث messages_sender_id_fkey می‌شوند خودکار ترمیم می‌کند.
  try{
    let canonical=null;
    if(currentUser?.profile?.username){
      const {data,error}=await supabaseClient
        .from("profiles")
        .select("id,username,display_name,avatar_url,bio")
        .eq("username",String(currentUser.profile.username).trim())
        .maybeSingle();
      if(!error && data) canonical=data;
    }
    if(!canonical && currentUser?.id){
      const {data,error}=await supabaseClient
        .from("profiles")
        .select("id,username,display_name,avatar_url,bio")
        .eq("id",currentUser.id)
        .maybeSingle();
      if(!error && data) canonical=data;
    }
    if(!canonical?.id){
      sessionStorage.removeItem("love_profile");
      localStorage.removeItem("khatmin_remembered_profile");
      currentUser=null;
      document.getElementById("app").innerHTML="";
      document.getElementById("loginScreen").classList.remove("hidden");
      setLoginError("نشست قبلی منقضی شده؛ لطفاً دوباره وارد شوید.");
      return;
    }
    currentUser={profile:{...(currentUser.profile||{}),...canonical},id:canonical.id};
    const syncedProfile=JSON.stringify(currentUser.profile);
    sessionStorage.setItem("love_profile",syncedProfile);
    localStorage.setItem("khatmin_remembered_profile",syncedProfile);
  }catch(err){
    console.error("PROFILE SYNC ERROR:",err);
    document.getElementById("app").innerHTML="";
    document.getElementById("loginScreen").classList.remove("hidden");
    setLoginError("اتصال اطلاعات کاربر برقرار نشد؛ دوباره وارد شوید.");
    return;
  }

  document.getElementById("loginScreen").classList.add("hidden");
  await renderHome();
}

async function subscribeHomeInbox(){

  if(homeInboxChannel){try{await supabaseClient.removeChannel(homeInboxChannel)}catch(e){}homeInboxChannel=null}
  const name="love-home-inbox-"+currentUser.id;
  homeInboxChannel=supabaseClient
    .channel(name,{config:{broadcast:{self:false}}})
    .on("broadcast",{event:"typing"},payload=>{
      const data=payload?.payload||{};
      if(!data.sender_id || String(data.sender_id)===String(currentUser.id))return;
      setHomeTyping(String(data.sender_id),!!data.is_typing);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
      const m=payload.new;

      updateHomeLastMessage(m);

async function renderChats(){
  const list=document.getElementById("chatList");
  if(!list||!currentUser)return;

  // Paint the cached contacts immediately. The database sync happens in the background.
  let profiles=await getCachedProfiles();
  const myId=String(currentUser?.id||"");
  const myUsername=String(currentUser?.profile?.username||"").trim().toLowerCase();
  profiles=(profiles||[]).filter(p=>{
    const pid=String(p?.id||"");
    const pun=String(p?.username||"").trim().toLowerCase();
    return pid && pid!==myId && (!myUsername || pun!==myUsername);
  }).sort((a,b)=>String(a.display_name||a.username).localeCompare(String(b.display_name||b.username),'fa'));

  const renderCards=(allMessages)=>{
    const cards=[];
    for(const p of profiles){
      const pair=(allMessages||[]).filter(m=>String(m.sender_id)===String(p.id)||String(m.receiver_id)===String(p.id));
      const m=pair[pair.length-1];
      const readAt=getLastReadAt(p.id);
      const unread=pair.filter(x=>String(x.sender_id)===String(p.id)&&String(x.receiver_id)===String(currentUser.id)&&new Date(x.created_at)>new Date(readAt)).length;
      cards.push(`
        <button class="chat-card" data-partner-id="${esc(p.id)}" onclick='openChat(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
          <div class="avatar">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="" class="chat-avatar-image">` : esc((p.display_name||p.username||"?").slice(0,1))}</div>
          <div class="chat-main">
            <div class="chat-name">${esc(p.display_name)}</div>
            <div class="chat-last" data-last-text="${esc(m?m.content:"هنوز پیامی ندارید ♡")}">${m?esc(m.content):"هنوز پیامی ندارید ♡"}</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">${m?faTime(m.created_at):""}</div>
            ${unread>0?`<div class="unread-badge">${unread>99?"99+":unread}</div>`:""}
          </div>
        </button>`);
    }
    list.innerHTML=cards.length?cards.join(""):"<div class=\"empty\">مخاطب دیگری پیدا نشد.</div>";
  };

  const cachedMessages=await getCachedAllMessages();
  if(profiles.length) renderCards(cachedMessages);
  else list.innerHTML=`<div class="empty">در حال آماده‌سازی...</div>`;

  // First visit: one profiles query + one messages query. Later visits: only new messages.
  try{
    const {data:freshProfiles,error:pErr}=await supabaseClient
      .from("profiles").select("id,username,display_name,avatar_url,bio")
      .neq("id",currentUser.id).order("display_name");
    if(pErr)throw pErr;
    profiles=(freshProfiles||[]);
    await cacheProfiles(profiles);

    const allCached=await getCachedAllMessages();
    const latestCached=allCached.reduce((max,m)=>Math.max(max,new Date(m.created_at).getTime()),0);
    let query=supabaseClient.from("messages")
      .select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme")
      .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
      .order("created_at",{ascending:true});
    if(latestCached)query=query.gt("created_at",new Date(latestCached).toISOString());
    let {data:newMessages,error:mErr}=await query;
    if(mErr && /column .* does not exist/i.test(mErr.message||"")){
      let fallback=supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme")
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order("created_at",{ascending:true});
      if(latestCached)fallback=fallback.gt("created_at",new Date(latestCached).toISOString());
      const r=await fallback;newMessages=r.data;mErr=r.error;
    }
    if(mErr)throw mErr;
    await cacheMessages(newMessages||[]);
    renderCards(await getCachedAllMessages());
  }catch(err){
    console.warn("BACKGROUND CHAT CACHE SYNC:",err);
    if(!profiles.length && !list.innerHTML.trim())list.innerHTML=`<div class="empty">خطا در دریافت مخاطب‌ها: ${esc(err.message||"خطای اتصال")}</div>`;
  }
}

function jalaliToGregorian(jy,jm,jd){
  jy=Number(jy);jm=Number(jm);jd=Number(jd);
  jy+=1595;
  let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  let gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365;}
  let gd=days+1;const leap=(gy%4===0&&gy%100!==0)||gy%400===0;const ml=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=1;
  while(gm<=12&&gd>ml[gm]){gd-=ml[gm];gm++;}
  return new Date(gy,gm-1,gd);
}
function gregorianToJalali(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];gy-=1600;gm-=1;gd-=1;
  let gdn=365*gy+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400)+gdm[gm]+gd;
  if(gm>1&&((gy+1600)%4===0&&((gy+1600)%100!==0)||(gy+1600)%400===0))gdn++;
  let jdn=gdn-79,jnp=Math.floor(jdn/12053);jdn%=12053;let jy=979+33*jnp+4*Math.floor(jdn/1461);jdn%=1461;
  if(jdn>=366){jy+=Math.floor((jdn-1)/365);jdn=(jdn-1)%365;}
  const jm=jdn<186?1+Math.floor(jdn/31):7+Math.floor((jdn-186)/30);const jd=1+(jdn<186?jdn%31:(jdn-186)%30);return {jy,jm,jd};
}
function notificationLocalDateValue(date){
  const d=new Date(date);if(Number.isNaN(d.getTime()))return "";

  const theme=document.getElementById("chatNotifyTheme")?.value||"none";
  const expiresAt=new Date(scheduledAt.getTime()+24*60*60*1000);
  const payload={sender_id:currentUser.id,receiver_id:chatPartner.id,content,theme,scheduled_at:scheduledAt.toISOString(),expires_at:expiresAt.toISOString()};
  let result;
  if(activeChatNotification?.id){
    result=await supabaseClient.from("chat_notifications").update(payload).eq("id",activeChatNotification.id).eq("sender_id",currentUser.id).select("*").single();
  }else{
    result=await supabaseClient.from("chat_notifications").upsert(payload,{onConflict:"sender_id,receiver_id"}).select("*").single();
  }
  if(result.error){alert("ذخیره اعلان انجام نشد:\n"+(result.error.message||"خطای اتصال"));return;}
  activeChatNotification=result.data;
  closeNotificationComposer();
  alert(scheduledAt.getTime()<=Date.now()+1000?"اعلان ارسال شد ♡":"اعلان برای زمان انتخابی تنظیم شد ⏱️");
}

}

async function loadIncomingChatNotification(){
  if(!currentUser||!chatPartner)return;
  const now=new Date().toISOString();
  const {data,error}=await supabaseClient.from("chat_notifications").select("*")
    .eq("sender_id",chatPartner.id).eq("receiver_id",currentUser.id).lte("scheduled_at",now).gt("expires_at",now)
    .order("scheduled_at",{ascending:false}).limit(1).maybeSingle();
  if(error){if(!/relation .*chat_notifications.*does not exist/i.test(error.message||""))console.warn("NOTIFICATION LOAD:",error);return;}
  activeIncomingNotification=data||null;
  renderIncomingNotification(data);
}

function renderIncomingNotification(n){
  const host=document.getElementById("chatNotificationHost"); if(!host)return;
  if(!n){host.innerHTML="";return;}
  host.innerHTML=`<div class="chat-notification-banner ${notificationThemeClass(n.theme)}" data-notification-id="${esc(n.id)}" onclick="openNotificationReply('${esc(n.id)}')">
    <div class="chat-notification-banner-top"><span class="chat-notification-theme-dot">${notificationThemeIcon(n.theme)}</span><div><div class="chat-notification-banner-label">اعلان جدید از ${esc(chatPartner?.display_name||"کاربر")}</div><div class="chat-notification-banner-reply">برای پاسخ، روی اعلان بزن</div></div></div>
    <div class="chat-notification-banner-text">${esc(n.content)}</div>
  </div>`;
  if(!n.seen_at){
    setTimeout(()=>{
      triggerNotificationThemeEffect(n.theme);
      supabaseClient.from("chat_notifications").update({seen_at:new Date().toISOString()}).eq("id",n.id).eq("receiver_id",currentUser.id).is("seen_at",null).then(()=>{});

}

function triggerNotificationThemeEffect(theme){
  const symbols=theme==="heart"?["♥","♡","❤","💗","💜"]:theme==="cry"?["💧","💦","﹏"]:theme==="laugh"?["☻","☺","✦","✧"]:[];
  if(!symbols.length)return;
  const layer=document.createElement("div");layer.className="chat-notify-particles";document.body.appendChild(layer);
  for(let i=0;i<30;i++){
    const el=document.createElement("span");el.className="chat-notify-particle";el.textContent=symbols[i%symbols.length];
    el.style.setProperty("--x",`${Math.round((Math.random()-.5)*90)}vw`);el.style.setProperty("--y",`${Math.round((Math.random()-.2)*80)}vh`);
    el.style.setProperty("--sz",`${12+Math.round(Math.random()*25)}px`);el.style.setProperty("--op",`${.35+Math.random()*.55}`);el.style.setProperty("--delay",`${Math.round(Math.random()*500)}ms`);el.style.setProperty("--r",`${Math.round((Math.random()-.5)*80)}deg`);
    layer.appendChild(el);
  }
  setTimeout(()=>layer.remove(),3900);
}

function subscribeChatNotifications(){
  if(notificationChannel){supabaseClient.removeChannel(notificationChannel).catch(()=>{});notificationChannel=null;}
  if(!currentUser||!chatPartner)return;
  notificationChannel=supabaseClient.channel(`chat-notifications-${currentUser.id}-${chatPartner.id}`)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_notifications"},payload=>{
      const n=payload.new;if(!n)return;
      if(String(n.receiver_id)===String(currentUser.id)&&String(n.sender_id)===String(chatPartner.id)){activeIncomingNotification=n;renderIncomingNotification(n);}
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"chat_notifications"},payload=>{
      const n=payload.new;if(!n)return;
      if(String(n.receiver_id)===String(currentUser.id)&&String(n.sender_id)===String(chatPartner.id)){activeIncomingNotification=n;renderIncomingNotification(n);}
      if(String(n.sender_id)===String(currentUser.id)&&String(n.receiver_id)===String(chatPartner.id)){activeChatNotification=n;}
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"chat_notifications"},payload=>{
      const n=payload.old;if(!n)return;
      if(String(n.receiver_id)===String(currentUser.id)&&String(n.sender_id)===String(chatPartner.id)){activeIncomingNotification=null;renderIncomingNotification(null);}
      if(String(n.sender_id)===String(currentUser.id)&&String(n.receiver_id)===String(chatPartner.id)){activeChatNotification=null;}
    }).subscribe();
}

async function loadMessages(){
  const box=document.getElementById("messages");
  if(!box||!chatPartner)return;

  // Cached messages are rendered first, so reopening a chat is effectively instant.
  let cached=await getCachedMessages(chatPartner.id);
  if(cached.length){
    hiddenMessageIds=new Set();
    messageCache=new Map();
    cached.forEach(m=>messageCache.set(String(m.id),m));
    box.innerHTML=cached.map(renderMessage).join("");
    attachMessageGestures();
    box.scrollTop=box.scrollHeight;
  }

  messageReactionCache.clear();
  // Sync only messages newer than the newest locally stored message.
  syncChatMessages(cached.length?cached[cached.length-1].created_at:null).catch(e=>console.warn("CHAT BACKGROUND SYNC:",e));

  if(!cached.length)box.innerHTML=`<div class="empty">در حال دریافت پیام‌ها...</div>`;
}

async function syncChatMessages(latestCreatedAt){
  if(!chatPartner||!currentUser)return;
  const partnerId=String(chatPartner.id);
  const messageFilter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`;
  let query=supabaseClient.from("messages")
    .select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme")
    .or(messageFilter).order("created_at",{ascending:true});
  if(latestCreatedAt)query=query.gt("created_at",latestCreatedAt);
  let {data,error}=await query;
  if(error && /column .* does not exist/i.test(error.message||"")){
    let fallback=supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme")
      .or(messageFilter).order("created_at",{ascending:true});
    if(latestCreatedAt)fallback=fallback.gt("created_at",latestCreatedAt);
    const r=await fallback;data=r.data;error=r.error;
  }
  if(error)throw error;
  await cacheMessages(data||[]);

  const merged=mergeMessagesIntoCache(await getCachedMessages(partnerId),data||[]);
  messageCache=new Map(merged.map(m=>[String(m.id),m]));
  const box=document.getElementById("messages");
  if(!box||!chatPartner||String(chatPartner.id)!==partnerId)return;
  if(!merged.length){box.innerHTML=`<div class="empty">هنوز گفت‌وگویی شروع نشده ♡</div>`;return;}
  syncChatExtras(merged).catch(e=>console.warn("CHAT EXTRAS SYNC:",e));
  const wasAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
  box.innerHTML=merged.map(renderMessage).join("");
  attachMessageGestures();
  if(wasAtBottom||!latestCreatedAt)box.scrollTop=box.scrollHeight;
  const newestIncoming=merged.filter(m=>String(m.sender_id)===partnerId);
  if(newestIncoming.length)markChatRead(partnerId,newestIncoming[newestIncoming.length-1].created_at).catch(()=>{});
}
async function syncChatExtras(messages){
  const ids=(messages||[]).map(m=>m.id).filter(Boolean);
  if(!ids.length||!currentUser)return;
  try{
    const {data:hidden,error:hiddenError}=await supabaseClient.from("message_user_deletions")
      .select("message_id").eq("user_id",currentUser.id).in("message_id",ids);
    if(!hiddenError){
      hiddenMessageIds=new Set((hidden||[]).map(x=>String(x.message_id)));
      hiddenMessageIds.forEach(id=>{messageCache.delete(id);document.querySelector(`[data-msg-id="${CSS.escape(id)}"]`)?.remove()});
      ensureMessageEmptyState();
    }
  }catch(e){}
  try{
    const {data:reactions}=await supabaseClient.from("message_reactions")
      .select("message_id,user_id,reaction,created_at").in("message_id",ids).order("created_at",{ascending:false});
    messageReactionCache.clear();
    (reactions||[]).forEach(r=>{if(!messageReactionCache.has(String(r.message_id)))messageReactionCache.set(String(r.message_id),r)});
    (messages||[]).forEach(m=>{if(!hiddenMessageIds.has(String(m.id)))refreshMessageElement(m,true)});
  }catch(e){}
}

  if(!m?.reply_to_id)return "";

function messageStatusHtml(m){

  if(m.read_at){
    return `<span class="msg-status seen" title="دیده شد" aria-label="دیده شد">✓✓</span>`;

function renderMessage(m){
  const mine=m.sender_id===currentUser.id;
  const deleted=!!m.deleted_for_everyone;
  const cls=`msg ${mine?"mine":"theirs"}`;
  const footer=deleted
    ? ""
    : `<div class="msg-footer">${messageStatusHtml(m)}<span class="msg-time">${faTime(m.created_at)}</span>${m.edited_at?`<span class="msg-edited">ویرایش شد</span>`:""}</div>`;
  const reaction=messageReactionCache.get(String(m.id));
  const reactionBadge=(!deleted && reaction?.reaction)
    ? `<span class="msg-reaction-badge" title="واکنش">${esc(reaction.reaction)}</span>`
    : "";
  const isVoice=!deleted && typeof m.content==="string" && (m.content.startsWith("__KHATMIN_VOICE_URL__") || m.content.startsWith("__KHATMIN_VOICE__"));
  const voiceSrc=isVoice
    ? (m.content.startsWith("__KHATMIN_VOICE_URL__") ? m.content.slice("__KHATMIN_VOICE_URL__".length) : m.content.slice("__KHATMIN_VOICE__".length))
    : "";
  const voiceBars=Array.from({length:30},(_,i)=>{
    const heights=[34,52,68,44,78,58,88,48,70,38,62,82,52,72,94,58,76,46,66,86,54,72,42,64,82,50,70,40,58,76];
    return `<span class="voice-bar" style="--h:${heights[i]}%;--d:${(i%7)*70}ms"></span>`;
  }).join("");
  const voiceId=`voice-${String(m.id).replace(/[^a-zA-Z0-9_-]/g,"")}`;
  const contentHtml=isVoice
    ? `${replyPreviewHtml(m)}<div class="voice-message-player" data-voice-id="${esc(voiceId)}" oncontextmenu="return false">
        <button class="voice-play-btn" type="button" onclick="toggleVoiceMessage('${esc(voiceId)}')" aria-label="پخش ویس">
          <svg class="voice-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4a1 1 0 0 0 1.52.85l9.6-6.2a1 1 0 0 0 0-1.68l-9.6-6.2A1 1 0 0 0 8 5.8Z"/></svg>
        </button>
        <div class="voice-wave" onclick="seekVoiceMessage('${esc(voiceId)}',event)" aria-hidden="true">${voiceBars}</div>
        <span class="voice-duration">00:00</span>
        <audio id="${esc(voiceId)}" preload="metadata" src="${esc(voiceSrc)}" controlsList="nodownload noplaybackrate" disablePictureInPicture></audio>
      </div>`
    : `${replyPreviewHtml(m)}${esc(m.content||"")}`;
  const body=`<span class="${cls}${deleted?" deleted":""}${isVoice?" voice-msg":""}">${deleted?esc(messageDisplayText(m)):contentHtml}${reactionBadge}${footer}</span>`;
  return `<div class="msg-wrap ${mine?"mine":"theirs"}" data-msg-id="${esc(m.id)}">${body}</div>`;
}

function formatVoiceDuration(seconds){
  const n=Number(seconds);
  if(!Number.isFinite(n)||n<0)return "00:00";
  const total=Math.floor(n);
  const min=Math.floor(total/60);
  const sec=total%60;
  return `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function updateVoiceMessageUI(audio){
  if(!audio)return;
  const player=audio.closest(".voice-message-player");
  if(!player)return;
  const btn=player.querySelector(".voice-play-btn");
  const duration=player.querySelector(".voice-duration");
  const bars=[...player.querySelectorAll(".voice-bar")];
  const current=Number(audio.currentTime);
  const total=Number(audio.duration);
  const hasTotal=Number.isFinite(total)&&total>0;
  const safeCurrent=Number.isFinite(current)&&current>=0?current:0;
  const playing=!audio.paused&&!audio.ended;
  const ended=!!audio.ended;
  const remaining=hasTotal?Math.max(0,total-safeCurrent):0;
  if(duration){
    duration.textContent=formatVoiceDuration(playing||(!ended&&safeCurrent>0)?remaining:hasTotal?total:0);
  }
  const ratio=hasTotal?Math.max(0,Math.min(1,safeCurrent/total)):0;
  bars.forEach((bar,i)=>bar.classList.toggle("active",i<Math.round(ratio*bars.length)));
  player.classList.toggle("playing",playing);
  if(btn){
    btn.setAttribute("aria-label",playing?"توقف ویس":"پخش ویس");
    btn.innerHTML=playing
      ? `<svg class="voice-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 6.2a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1 1H8.5a1 1 0 0 1-1-1V6.2Zm5.8 0a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-1V6.2Z"/></svg>`
      : `<svg class="voice-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4a1 1 0 0 0 1.52.85l9.6-6.2a1 1 0 0 0 0-1.68l-9.6-6.2A1 1 0 0 0 8 5.8Z"/></svg>`;
  }
}

function bindVoicePlayers(root=document){
  root.querySelectorAll?.(".voice-message-player audio").forEach(audio=>{
    if(audio.dataset.bound)return;
    audio.dataset.bound="1";
    audio.addEventListener("loadedmetadata",()=>updateVoiceMessageUI(audio));
    audio.addEventListener("durationchange",()=>updateVoiceMessageUI(audio));
    audio.addEventListener("timeupdate",()=>updateVoiceMessageUI(audio));
    audio.addEventListener("play",()=>{
      document.querySelectorAll(".voice-message-player audio").forEach(other=>{if(other!==audio&&!other.paused){other.pause();}});
      updateVoiceMessageUI(audio);
    });
    audio.addEventListener("pause",()=>updateVoiceMessageUI(audio));
    audio.addEventListener("ended",()=>{audio.currentTime=0;updateVoiceMessageUI(audio)});
    audio.addEventListener("error",()=>updateVoiceMessageUI(audio));
    updateVoiceMessageUI(audio);
  });
}

function toggleVoiceMessage(id){
  const audio=document.getElementById(id);
  if(!audio)return;
  if(audio.paused) audio.play().catch(()=>{});
  else audio.pause();

function seekVoiceMessage(id,event){
  const audio=document.getElementById(id);
  const wave=event?.currentTarget;
  if(!audio||!wave||!Number.isFinite(audio.duration)||audio.duration<=0)return;
  const rect=wave.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
  audio.currentTime=ratio*audio.duration;
  updateVoiceMessageUI(audio);
}

function attachMessageGestures(){
  const box=document.getElementById("messages");
  if(!box)return;
  box.querySelectorAll(".msg-wrap").forEach(el=>{
    if(el.dataset.gestureBound)return;
    el.dataset.gestureBound="1";
    el.addEventListener("pointerdown",messagePointerDown,{passive:true});
    el.addEventListener("pointermove",messagePointerMove,{passive:true});
    el.addEventListener("pointerup",messagePointerUp,{passive:true});
    el.addEventListener("pointercancel",messagePointerCancel,{passive:true});
    el.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")messagePointerCancel(e)},{passive:true});
    el.addEventListener("contextmenu",e=>{e.preventDefault();openMessageActions(el.dataset.msgId) });
  });
}

function clearMessagePress(){
  clearTimeout(messagePressTimer);messagePressTimer=null;messagePressTarget=null;messageGesture=null;
}

function messagePointerDown(e){
  if(e.button!==undefined && e.button!==0)return;
  const el=e.currentTarget;
  const m=messageCache.get(String(el.dataset.msgId));
  if(!m)return;
  clearMessagePress();
  const point=e.touches?.[0]||e;
  messageGesture={startX:point.clientX,startY:point.clientY,lastX:point.clientX,active:true,moved:false};
  messagePressTarget=el;
  messagePressTimer=setTimeout(()=>{
    if(messageGesture?.active&&!messageGesture.moved){
      navigator.vibrate?.(12);
      openMessageActions(el.dataset.msgId);
      messageGesture.active=false;
    }
  },480);
}

function messagePointerMove(e){
  if(!messageGesture?.active)return;
  const point=e.touches?.[0]||e;
  messageGesture.lastX=point.clientX;
  const dx=point.clientX-messageGesture.startX;
  const dy=point.clientY-messageGesture.startY;
  if(Math.abs(dx)>10 || Math.abs(dy)>10)messageGesture.moved=true;
  if(Math.abs(dx)>16 && Math.abs(dx)>Math.abs(dy)*1.15){
    clearTimeout(messagePressTimer);
    if(Math.abs(dx)<100){
      messagePressTarget.classList.add("swiping");
      messagePressTarget.querySelector(".msg").style.transform=`translateX(${Math.max(-72,Math.min(72,dx))}px)`;
    }
  }
  if(Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.2){
    clearTimeout(messagePressTimer);
  }
}

function messagePointerUp(e){
  if(!messageGesture?.active)return;
  const el=messagePressTarget;
  const point=e.changedTouches?.[0]||e;
  const dx=point.clientX-messageGesture.startX;
  const dy=point.clientY-messageGesture.startY;
  clearTimeout(messagePressTimer);
  messagePressTimer=null;
  if(el){
    el.classList.remove("swiping");
    const bubble=el.querySelector(".msg");
    if(bubble){bubble.style.transform=""}
    if(Math.abs(dx)>58 && Math.abs(dx)>Math.abs(dy)*1.2){
      const m=messageCache.get(String(el.dataset.msgId));
      if(m)startReply(m);
    }
  }
  messageGesture.active=false;
}

function messagePointerCancel(){
  clearTimeout(messagePressTimer);messagePressTimer=null;
  if(messagePressTarget){messagePressTarget.classList.remove("swiping");const bubble=messagePressTarget.querySelector(".msg");if(bubble)bubble.style.transform=""}
  if(messageGesture)messageGesture.active=false;
}

function subscribeMessages(){
  const channelName=getChatChannelName();
  realtimeChannel=supabaseClient
    .channel(channelName)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
      const m=payload.new;
      const relevant=(m.sender_id===currentUser.id&&m.receiver_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.receiver_id===currentUser.id);
      if(!relevant)return;
      messageCache.set(String(m.id),m);
      cacheMessages([m]).catch(()=>{});
      if(hiddenMessageIds.has(String(m.id)))return;
      if(m.reply_to_id && !messageCache.has(String(m.reply_to_id))){
        const {data:original}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,edited_at,reply_to_id,deleted_for_everyone,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme").eq("id",m.reply_to_id).maybeSingle();
        if(original)messageCache.set(String(original.id),original);
      }
      const box=document.getElementById("messages");if(!box)return;
      box.querySelector(".empty")?.remove();
      if(document.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"]`))return;
      box.insertAdjacentHTML("beforeend",renderMessage(m));attachMessageGestures();bindVoicePlayers();box.scrollTop=box.scrollHeight;
      if(String(m.sender_id)===String(chatPartner.id)){
        markChatRead(chatPartner.id,m.created_at).catch(()=>{});
      }
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},payload=>{
      const m=payload.new;
      const relevant=(m.sender_id===currentUser.id&&m.receiver_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.receiver_id===currentUser.id);
      if(!relevant)return;
      messageCache.set(String(m.id),m);
      cacheMessages([m]).catch(()=>{});
      if(hiddenMessageIds.has(String(m.id)))return;
      refreshMessageElement(m);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.new;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      if(!m)return;
      messageReactionCache.set(id,r);
      refreshMessageElement(m,true);
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.new;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      if(!m)return;
      messageReactionCache.set(id,r);
      refreshMessageElement(m,true);
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"message_reactions"},payload=>{
      const r=payload.old;
      const id=String(r.message_id);
      const m=messageCache.get(id);
      messageReactionCache.delete(id);
      if(m)refreshMessageElement(m);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"message_user_deletions"},payload=>{
      const d=payload.new;
      if(String(d.user_id)!==String(currentUser.id))return;
      const id=String(d.message_id);
      hiddenMessageIds.add(id);messageCache.delete(id);
      localCacheDelete("messages",messageCacheKey(currentUser.id,id)).catch(()=>{});
      document.querySelector(`[data-msg-id="${CSS.escape(id)}"]`)?.remove();ensureMessageEmptyState();
    })
    .subscribe(status=>console.log("Realtime:",status));
}

      blocker_id:currentUser.id,

let voiceRecorder=null;
let voiceChunks=[];
let voiceRecording=false;
let voiceTimer=null;
let voiceStartedAt=0;
let voiceShouldSend=false;

function formatVoiceDuration(seconds){
  const total=Math.max(0,Math.floor(Number(seconds)||0));
  const mins=Math.floor(total/60);
  const secs=total%60;
  return `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function updateVoiceTimer(){
  const el=document.getElementById("voiceRecorderTime");
  if(!el)return;
  el.textContent=formatVoiceDuration((Date.now()-voiceStartedAt)/1000);
}

function startVoiceTimer(){
  clearInterval(voiceTimer);
  voiceStartedAt=Date.now();
  updateVoiceTimer();
  voiceTimer=setInterval(updateVoiceTimer,250);
}

function stopVoiceTimer(){
  clearInterval(voiceTimer);
  voiceTimer=null;
}

function setVoiceComposerState(recording){
  const composer=document.getElementById("composer");
  const input=document.getElementById("messageInput");
  const ui=document.getElementById("voiceRecorderUI");
  const attach=document.getElementById("attachButton");
  if(!composer)return;

  composer.classList.toggle("recording",!!recording);

  if(ui)ui.classList.toggle("show",!!recording);
  if(ui)ui.setAttribute("aria-hidden",recording?"false":"true");

  if(input){
    input.setAttribute("aria-hidden",recording?"true":"false");
    if(recording)input.blur();
  }

  if(attach){
    attach.classList.toggle("voice-cancel",!!recording);
    if(recording){
      attach.setAttribute("aria-label","لغو ضبط ویس");
      attach.setAttribute("title","لغو ضبط ویس");
      attach.innerHTML=`<svg class="trash-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5.5 7.5h13M9 7.5V5.7c0-.55.45-1 1-1h4c.55 0 1 .45 1 1v1.8M8 10.2v7.4c0 .77.63 1.4 1.4 1.4h5.2c.77 0 1.4-.63 1.4-1.4v-7.4M10.3 10.2v6.1M13.7 10.2v6.1"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }else{
      attach.setAttribute("aria-label","پیوست");
      attach.setAttribute("title","پیوست");
      attach.innerHTML=`<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8.2 12.7l6.25-6.25a3.25 3.25 0 0 1 4.6 4.6l-7.3 7.3a5 5 0 0 1-7.07-7.07l7.3-7.3a6.75 6.75 0 0 1 9.55 9.55l-7.3 7.3"
          stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

async function toggleVoiceRecording(){
  const input=document.getElementById("messageInput");
  if(!input)return;
  if(voiceRecording){
    voiceShouldSend=true;
    stopVoiceRecording(true);
    return;
  }
  if(String(input.value||"").trim())return;
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){
    alert("مرورگر این دستگاه ضبط ویس را پشتیبانی نمی‌کند.");return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported?.(x));
    voiceChunks=[];
    voiceShouldSend=false;
    const timerEl=document.getElementById("voiceRecorderTime");
    if(timerEl)timerEl.textContent="00:00";
    voiceRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
    voiceRecorder.onstop=async()=>{
      const rec=voiceRecorder;
      stream.getTracks().forEach(t=>t.stop());
      const shouldSend=voiceShouldSend;
      voiceRecorder=null;
      voiceRecording=false;
      stopVoiceTimer();
      const duration=Math.max(0,Math.floor((Date.now()-voiceStartedAt)/1000));
      const timeEl=document.getElementById("voiceRecorderTime");
      if(timeEl)timeEl.textContent=formatVoiceDuration(duration);
      setVoiceComposerState(false);
      updateComposerAction();
      const blob=new Blob(voiceChunks,{type:rec?.mimeType||'audio/webm'});
      voiceChunks=[];
      if(!shouldSend || blob.size<700)return;
      if(blob.size>8*1024*1024){alert("ویس خیلی حجیم است؛ لطفاً کوتاه‌تر ضبط کنید.");return;}
      try{
        const ext=(rec?.mimeType||blob.type||"audio/webm").includes("ogg")?"ogg":(rec?.mimeType||blob.type||"").includes("mp4")?"m4a":"webm";
        const path=`${String(currentUser.id)}/${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}.${ext}`;
        const {error:uploadError}=await supabaseClient.storage
          .from("voice-messages")
          .upload(path,blob,{
            contentType:rec?.mimeType||blob.type||"audio/webm",
            cacheControl:"3600",
            upsert:false
          });
        if(uploadError){
          console.error("VOICE UPLOAD ERROR:",uploadError);
          alert("ویس آپلود نشد:\n"+(uploadError.message||"خطای ناشناخته"));
          return;
        }
        const {data:urlData}=supabaseClient.storage.from("voice-messages").getPublicUrl(path);
        const voiceUrl=urlData?.publicUrl||"";
        if(!voiceUrl){
          alert("آدرس ویس ساخته نشد. لطفاً دوباره تلاش کنید.");
          return;
        }
        const ok=await sendRawMessage("__KHATMIN_VOICE_URL__"+voiceUrl);
        if(!ok){
          // اگر درج پیام در دیتابیس شکست خورد، فایل بی‌استفاده را هم پاک می‌کنیم.
          await supabaseClient.storage.from("voice-messages").remove([path]).catch(()=>{});
          return;
        }
        document.getElementById("messageInput")?.focus();
      }catch(uploadErr){
        console.error("VOICE UPLOAD UNEXPECTED ERROR:",uploadErr);
        alert("خطا در ارسال ویس:\n"+(uploadErr?.message||"خطای ناشناخته"));
      }
    };
    voiceRecorder.start(180);
    voiceRecording=true;
    setVoiceComposerState(true);
    startVoiceTimer();
    updateComposerAction();
  }catch(err){
    voiceRecorder=null;voiceRecording=false;voiceShouldSend=false;voiceChunks=[];
    stopVoiceTimer();setVoiceComposerState(false);updateComposerAction();
    alert("اجازه دسترسی به میکروفون داده نشد.");
  }
}

function stopVoiceRecording(send=true){
  if(!voiceRecorder)return;
  voiceShouldSend=!!send;
  try{voiceRecorder.stop()}catch(e){}
}

async function sendRawMessage(content){
  if(!content||!chatPartner||!currentUser)return false;
  try{
    const row={sender_id:currentUser.id,receiver_id:chatPartner.id,content};
    const {data,error}=await supabaseClient.from("messages").insert(row).select("*").single();
    if(error)throw error;
    if(data){messageCache.set(String(data.id),data);await cacheMessages([data]);}
    const box=document.getElementById("messages");
    if(box){box.querySelector(".empty")?.remove();if(data&&!box.querySelector(`[data-msg-id="${CSS.escape(String(data.id))}"]`)){box.insertAdjacentHTML("beforeend",renderMessage(data));attachMessageGestures();bindVoicePlayers();box.scrollTop=box.scrollHeight;}}
    return true;
  }catch(err){alert("ویس ارسال نشد: "+(err?.message||"خطای اتصال"));return false;}
}

async function sendMessage(e){
  if(e) e.preventDefault();
  const input=document.getElementById("messageInput");
  const button=document.getElementById("sendButton");
  if(!input || !chatPartner || !currentUser)return;

  const content=input.value.trim();
  if(!content)return;

  stopTyping();
  input.disabled=true;
  if(button) button.disabled=true;

  try{
    if(editingMessageId){
      const ok=await editMessage(editingMessageId,content);
      if(!ok)return;
      cancelMessageMode();
      input.focus();
      return;
    }

    // قبل از INSERT هر دو شناسه را از profiles تأیید می‌کنیم تا خطای FK به کاربر نمایش داده نشود.
    const {data:senderProfile,senderError}=await (async()=>{
      const r=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio").eq("id",currentUser.id).maybeSingle();
      return {data:r.data,senderError:r.error};
    })();
    if(senderError || !senderProfile?.id){
      sessionStorage.removeItem("love_profile");
      currentUser=null;
      alert("اطلاعات حساب با دیتابیس هماهنگ نیست. لطفاً یک‌بار خارج شوید و دوباره وارد شوید.");
      return;
    }

    const {data:receiverProfile, error:receiverError}=await supabaseClient
      .from("profiles")
      .select("id")
      .eq("id",chatPartner.id)
      .maybeSingle();
    if(receiverError || !receiverProfile?.id){
      alert("این مخاطب دیگر در فهرست کاربران وجود ندارد. فهرست گفتگوها را تازه‌سازی کنید.");
      return;
    }

    const payload={
      sender_id:senderProfile.id,
      receiver_id:receiverProfile.id,
      content:content
    };

    if(replyingToMessage?.id){
      payload.reply_to_id=replyingToMessage.id;
    }
    if(replyingToNotification?.id){
      payload.notification_reply_to_id=replyingToNotification.id;
      payload.notification_reply_text=replyingToNotification.content||"";
      payload.notification_reply_theme=replyingToNotification.theme||"none";
    }

    // مهم: ذخیره پیام را از SELECT ستون‌های اختیاری جدا می‌کنیم.
    // این باعث می‌شود نبودن edited_at/reply_to_id/... مانع ارسال پیام نشود.
    let result=await supabaseClient.from("messages").insert(payload).select("id,sender_id,receiver_id,content,created_at,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme").single();

    // اگر ستون reply_to_id در دیتابیس وجود نداشت، پیام را بدون reply ذخیره کن.
    if(result.error && payload.reply_to_id && /reply_to_id|column .* does not exist/i.test(result.error.message||"")){
      const basicPayload={
        sender_id:currentUser.id,
        receiver_id:chatPartner.id,
        content:content
      };
      result=await supabaseClient.from("messages").insert(basicPayload).select("id,sender_id,receiver_id,content,created_at,read_at,notification_reply_to_id,notification_reply_text,notification_reply_theme").single();
    }

    if(result.error){
      console.error("SEND MESSAGE ERROR:",result.error);
      alert("پیام ارسال نشد:\n"+(result.error.message||"خطای ناشناخته"));
      return;
    }

    const saved=result.data;
    const box=document.getElementById("messages");

    if(saved && box){
      messageCache.set(String(saved.id),saved);
      await cacheMessages([saved]);
      if(box.querySelector(".empty"))box.innerHTML="";
      if(!document.querySelector(`[data-msg-id="${CSS.escape(String(saved.id))}"]`)){
        box.insertAdjacentHTML("beforeend",renderMessage(saved));
        attachMessageGestures();
        bindVoicePlayers();
      }
      box.scrollTop=box.scrollHeight;
    }

    input.value="";updateComposerAction();
    replyingToMessage=null;
    document.getElementById("replyBar")?.classList.remove("show");
    const icon=document.getElementById("replyBarIcon");
    if(icon)icon.textContent="↩";
    input.focus();

    // The new message is already in IndexedDB and in the live cache; no full-history SELECT is needed.

  }catch(err){
    console.error("SEND MESSAGE UNEXPECTED ERROR:",err);
    alert("خطا در ارسال پیام:\n"+(err?.message||"خطای ناشناخته"));
  }finally{
    input.disabled=false;
    if(button)button.disabled=false;
  }
}

function playWaterTransition(fromRect,toRect){
  const old=document.querySelector('.nav-liquid-flight');
  if(old) old.remove();

  const orb=document.createElement('div');
  orb.className='nav-liquid-flight';
  orb.innerHTML='<span class="flight-ring"></span><span class="flight-drop"></span><span class="flight-splash splash-a"></span><span class="flight-splash splash-b"></span><span class="flight-splash splash-c"></span><span class="flight-splash splash-d"></span><span class="flight-splash splash-e"></span>';
  document.body.appendChild(orb);

  const sx=fromRect.left+fromRect.width/2;
  const sy=fromRect.top+fromRect.height*0.12;
  const ex=toRect.left+toRect.width/2;
  const ey=toRect.top+toRect.height*0.18;
  const dx=ex-sx;
  const distance=Math.abs(dx);
  const arc=Math.max(58,Math.min(118,58+distance*.18));
  const mx=(sx+ex)/2;
  const my=Math.min(sy,ey)-arc;

  orb.style.left=sx+'px';
  orb.style.top=sy+'px';

  const animation=orb.animate([
    {left:sx+'px',top:sy+'px',opacity:0,transform:'translate(-50%,-50%) scale(.42,.68) rotate(-8deg)'},
    {left:sx+'px',top:(sy-13)+'px',opacity:1,transform:'translate(-50%,-50%) scale(.82,1.06) rotate(2deg)',offset:.10},
    {left:(sx+(mx-sx)*.42)+'px',top:(sy+(my-sy)*.42)+'px',opacity:1,transform:'translate(-50%,-50%) scale(1,.94) rotate(-4deg)',offset:.34},
    {left:mx+'px',top:my+'px',opacity:.96,transform:'translate(-50%,-50%) scale(.92,1.08) rotate(4deg)',offset:.56},
    {left:(ex+(mx-ex)*.32)+'px',top:(ey+(my-ey)*.32)+'px',opacity:1,transform:'translate(-50%,-50%) scale(.88,1.12) rotate(9deg)',offset:.82},
    {left:ex+'px',top:ey+'px',opacity:1,transform:'translate(-50%,-50%) scale(1.08,.72) rotate(0deg)'}
  ],{
    duration:420,
    easing:'cubic-bezier(.18,.78,.22,1)',
    fill:'forwards'
  });

  animation.finished.then(()=>{
    orb.classList.add('is-impact');
    orb.animate([
      {transform:'translate(-50%,-50%) scale(1.08,.72)',opacity:1},
      {transform:'translate(-50%,-50%) scale(1.55,.48)',opacity:.72,offset:.22},
      {transform:'translate(-50%,-50%) scale(.35,.24)',opacity:0}
    ],{duration:240,easing:'cubic-bezier(.16,.82,.2,1)',fill:'forwards'}).finished.then(()=>orb.remove());
  }).catch(()=>orb.remove());
}

function navPulse(btn,action){
  const nav=btn?.closest('.bottom-nav');
  if(!nav)return;

  const current=nav.querySelector('.nav-btn.active') || btn;
  const fromRect=current.getBoundingClientRect();
  const toRect=btn.getBoundingClientRect();

  if(current!==btn){
    const navWidth=nav.getBoundingClientRect().width||1;
    const fromX=fromRect.left+fromRect.width/2-nav.getBoundingClientRect().left;
    const toX=toRect.left+toRect.width/2-nav.getBoundingClientRect().left;
    nav.style.setProperty('--nav-from-x',`${(fromX/navWidth)*100}%`);
    nav.style.setProperty('--nav-x',`${(toX/navWidth)*100}%`);
    nav.classList.remove('nav-transition');
    void nav.offsetWidth;
    nav.classList.add('nav-transition');
  }

  nav.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('nav-target'));
  btn.classList.add('nav-target');

  if(action==='settings'){
    window.setTimeout(()=>renderSettings(),90);
  }else{
    window.setTimeout(()=>{
      if(action==='chat')renderHome();
      else if(action==='game'||action==='book')soon();
    },90);
  }
}

function renderAppearanceThemes(){
  const grid=document.getElementById("appearanceThemeGrid");if(!grid)return;
  const mode=appearanceMode(document.body.dataset.khatTheme||"dark-purple");
  const themeLogos={
    "dark-purple":`<path d="M24 7 36 18 24 41 12 18 24 7Z"/><path d="m12 18 12 6 12-6M24 24v17"/>`,
    "dark-pink":`<path d="M24 39C8 31 9 15 19 12c3.8-1.1 5.8 2 5 5.3C25.2 14 28.1 11 31.7 12.3 41 15.7 40 30.8 24 39Z"/><path d="M24 18c-2 4-2 9 0 14"/>`,
    "dark-blue":`<path d="M7 28c5-8 10-8 17 0s12 8 17 0"/><path d="M7 20c5-8 10-8 17 0s12 8 17 0"/>`,
    "dark-green":`<path d="M36 10C20 11 10 20 12 36c16 2 25-8 24-26Z"/><path d="M13 35c7-8 13-13 21-19"/>`,
    "dark-cyan":`<circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="5"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6"/>`,
    "dark-gold":`<path d="m24 6 4.2 11.8L40 24l-11.8 4.2L24 40l-4.2-11.8L8 24l11.8-6.2L24 6Z"/><circle cx="24" cy="24" r="3"/>`,
    "light-lavender":`<path d="M24 7 36 18 24 41 12 18 24 7Z"/><path d="m12 18 12 6 12-6M24 24v17"/>`,
    "light-rose":`<path d="M24 39C8 31 9 15 19 12c3.8-1.1 5.8 2 5 5.3C25.2 14 28.1 11 31.7 12.3 41 15.7 40 30.8 24 39Z"/><path d="M24 18c-2 4-2 9 0 14"/>`,
    "light-blue":`<path d="M7 28c5-8 10-8 17 0s12 8 17 0"/><path d="M7 20c5-8 10-8 17 0s12 8 17 0"/>`,
    "light-mint":`<path d="M36 10C20 11 10 20 12 36c16 2 25-8 24-26Z"/><path d="M13 35c7-8 13-13 21-19"/>`,
    "light-peach":`<circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="5"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6"/>`,
    "light-sand":`<path d="m24 6 4.2 11.8L40 24l-11.8 4.2L24 40l-4.2-11.8L8 24l11.8-6.2L24 6Z"/><circle cx="24" cy="24" r="3"/>`
  };
  grid.innerHTML=(APPEARANCE_THEMES[mode]||[]).map(([id,name,sub,bg,accent])=>`<button class="theme-card ${id===(document.body.dataset.khatTheme||"dark-purple")?"active":""}" type="button" onclick="selectAppearanceTheme('${id}')"><div class="theme-visual" style="--theme-card-accent:${accent};background:radial-gradient(circle at 78% 18%,${accent}66,transparent 30%),radial-gradient(circle at 18% 78%,${accent}35,transparent 35%),linear-gradient(145deg,${bg},${bg});border:1px solid ${accent}66"><span class="theme-glow"></span><span class="theme-orbit"></span><svg class="theme-logo" viewBox="0 0 48 48" aria-hidden="true" style="color:${accent}"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${themeLogos[id]||themeLogos["dark-purple"]}</g></svg></div><b>${name}</b></button>`).join("");
  document.getElementById("appearanceDarkMode")?.classList.toggle("active",mode==="dark"); document.getElementById("appearanceLightMode")?.classList.toggle("active",mode==="light");
}
function openAppearanceSettings(){
  applyAppearance(); const a=readAppearance(); const o=document.getElementById("appearanceOverlay"); if(!o)return;
  const range=document.getElementById("appearanceFontRange"); if(range)range.value=String(a.scale||1); updateAppearanceFontLabel(a.scale||1); renderAppearanceThemes(); o.classList.add("show");o.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
function closeAppearanceSettings(){const o=document.getElementById("appearanceOverlay");if(!o)return;o.classList.remove("show");o.setAttribute("aria-hidden","true");document.body.style.overflow="";}
function updateAppearanceFontLabel(v){const n=Math.round(Number(v)*100);const el=document.getElementById("appearanceFontValue");if(el)el.textContent=n+"٪";const p=document.querySelector(".appearance-size-preview");if(p)p.style.fontSize=`calc(22px * ${Number(v)||1})`}
function previewAppearanceFont(v){const scale=Math.min(1.2,Math.max(.85,Number(v)||1));document.documentElement.style.setProperty("--text-scale",scale);updateAppearanceFontLabel(scale);saveAppearance()}
function setAppearanceMode(mode){const current=document.body.dataset.khatTheme||"dark-purple";const list=APPEARANCE_THEMES[mode];const theme=list.some(x=>x[0]===current)?current:list[0][0];selectAppearanceTheme(theme)}
function selectAppearanceTheme(theme){document.body.dataset.khatTheme=theme;const scale=Number(getComputedStyle(document.documentElement).getPropertyValue("--text-scale"))||1;try{localStorage.setItem(APPEARANCE_KEY,JSON.stringify({theme,scale}))}catch(e){};renderAppearanceThemes()}
applyAppearance();
