<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input,textarea{ -webkit-user-select:text; user-select:text }
html,body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,Arial,sans-serif;background:#fff7fb;color:#4a3945}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(430px,100%);padding:28px 22px;border:1px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(255,255,255,.78);box-shadow:0 20px 60px rgba(170,110,145,.16);backdrop-filter:blur(20px)}
.logo{width:72px;height:72px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdbe9,#eadcff);font-size:32px;box-shadow:0 10px 25px rgba(180,120,160,.15)}
h1{font-size:25px;text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#927c89;margin:0 0 25px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;margin:0 5px 7px;color:#806a77}
.field input{width:100%;height:50px;border:1px solid #eadce4;border-radius:16px;background:#fff;padding:0 15px;outline:none;transition:.2s}
.field input:focus{border-color:#d7a9c0;box-shadow:0 0 0 4px rgba(215,169,192,.13)}
.login-btn{width:100%;height:52px;border:0;border-radius:17px;color:white;background:linear-gradient(135deg,#d88eaf,#b69adf);box-shadow:0 12px 25px rgba(180,120,160,.22);font-weight:bold}
.login-btn:disabled{opacity:.65;cursor:wait}
.error{min-height:22px;margin:12px 4px 0;color:#c45b78;font-size:12px;text-align:center;line-height:1.7}
.hint{text-align:center;color:#a28e9a;font-size:11px;margin:12px 0 0}

.app{min-height:100vh;padding-bottom:105px}
.top{padding:25px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.top-divider{height:1px;margin:0 18px;background:linear-gradient(90deg,transparent,#eadde5 18%,#eadde5 82%,transparent);opacity:.9}
.brand-title{font-weight:bold;font-size:20px}
.brand-sub{font-size:11px;color:#a38d99;margin-top:5px}
.icon-btn{width:43px;height:43px;border:0;border-radius:15px;background:rgba(255,255,255,.8);box-shadow:0 8px 25px rgba(170,110,145,.1);display:grid;place-items:center}
.icon-btn svg{width:21px;height:21px;stroke:#826474}
.content{padding:8px 15px}
.section-title{font-size:14px;margin:13px 4px}
.chat-list{display:grid;gap:10px}
.chat-card{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #f0e4eb;background:rgba(255,255,255,.8);border-radius:21px;padding:13px;text-align:right;box-shadow:0 7px 22px rgba(170,110,145,.07)}
.avatar{width:51px;height:51px;border-radius:18px;background:linear-gradient(135deg,#ffe0ec,#e9defc);display:grid;place-items:center;font-weight:bold;color:#806474;flex:none}
.chat-main{min-width:0;flex:1}
.chat-name{font-weight:bold;font-size:14px}
.chat-last{font-size:11px;color:#a18d99;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:#b19ca7}
.empty{padding:35px 15px;text-align:center;color:#a08d98;font-size:13px}

.bottom-nav{position:fixed;z-index:20;left:50%;bottom:17px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));height:68px;border:1px solid rgba(255,255,255,.75);border-radius:24px;background:rgba(255,255,255,.66);backdrop-filter:blur(20px);box-shadow:0 16px 45px rgba(130,90,120,.16);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.nav-btn{height:50px;border:0;background:transparent;display:grid;place-items:center;border-radius:18px}
.nav-btn.active{background:rgba(232,207,225,.55)}
.nav-btn svg{width:23px;height:23px;stroke:#8c7182}

.chat-view{min-height:100vh;display:flex;flex-direction:column}
.chat-header{height:74px;padding:12px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0e4eb;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
.chat-title{font-weight:bold;font-size:15px}
.chat-body{flex:1;padding:18px 13px 95px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 12px;border-radius:17px;font-size:13px;line-height:1.7;word-break:break-word;box-shadow:0 4px 14px rgba(160,110,140,.06)}
.msg.mine{align-self:flex-start;background:#ecdff5;border-bottom-left-radius:5px}
.msg.theirs{align-self:flex-end;background:#fff;border:1px solid #f1e6ed;border-bottom-right-radius:5px}
.msg-time{font-size:9px;color:#ad99a5;margin-top:3px}
.composer{position:fixed;z-index:10;left:50%;bottom:17px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;gap:8px;padding:8px;border-radius:22px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(130,90,120,.15)}
.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 10px;color:#4a3945}
.send{width:44px;height:44px;border:0;border-radius:16px;background:#d79bb8;color:#fff;display:grid;place-items:center}
.send svg{width:20px;height:20px;stroke:white}
.loading{opacity:.7}

/* ===== KHATMIN visual upgrade ===== */
.brand-title{
  font-family:"Caveat",cursive;
  font-size:32px;
  font-weight:700;
  letter-spacing:.4px;
  line-height:1;
  background:linear-gradient(120deg,#b9789c,#8c79b7,#c487a7);
  -webkit-background-clip:text;

  color:transparent;
}
.brand-sub{margin-top:7px}
.section-title{
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:700;
  color:#66515f;

}
.section-title:before{
  content:"";
  width:7px;height:7px;
  border-radius:50%;
  background:#d89db9;
  box-shadow:0 0 0 6px rgba(216,157,185,.12);
}
.chat-list{gap:12px}
.chat-card{
  position:relative;
  overflow:hidden;
  min-height:79px;
  border:1px solid rgba(255,255,255,.92);
  background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,244,249,.78));
  border-radius:25px;
  padding:13px 14px;
  box-shadow:0 12px 30px rgba(151,104,132,.10);
  transition:transform .18s ease,box-shadow .18s ease;
}
.chat-card:before{
  content:"";
  position:absolute;
  width:90px;height:90px;
  left:-35px;bottom:-55px;
  border-radius:50%;
  background:rgba(226,198,232,.24);
}
.chat-card:after{
  content:"";
  position:absolute;
  width:55px;height:55px;
  right:-20px;top:-25px;
  border-radius:50%;
  background:rgba(255,218,231,.30);
}
.chat-card:active{transform:scale(.985)}
.avatar{
  position:relative;
  z-index:1;
  width:54px;height:54px;
  border-radius:20px;
  background:linear-gradient(145deg,#ffe4ef 0%,#eadffb 100%);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 7px 16px rgba(150,105,140,.13);
  color:#806274;
  font-size:18px;
}
.chat-main,.chat-time{position:relative;z-index:1}
.chat-name{font-size:14px;color:#564451}
.chat-last{
  font-size:11px;
  color:#9a8792;
  margin-top:6px;
}
.chat-time{font-size:9px;color:#ad98a5;align-self:flex-start;margin-top:4px}

/* chat screen */
.chat-header{
  height:78px;
  border-bottom:1px solid rgba(235,220,229,.7);
  box-shadow:0 5px 20px rgba(150,105,135,.05);
}
.chat-title{
  font-size:15px;
  color:#55434f;
}
.chat-body{
  position:relative;
  background:
    radial-gradient(circle at 15% 12%,rgba(238,213,232,.22) 0 2px,transparent 3px),
    radial-gradient(circle at 85% 35%,rgba(248,207,223,.25) 0 2px,transparent 3px),
    linear-gradient(180deg,#fffafd 0%,#fff7fb 100%);
}
.chat-body:before{
  content:"KHATMIN";
  position:fixed;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%) rotate(-8deg);
  font-family:"Caveat",cursive;
  font-size:58px;
  font-weight:700;
  color:rgba(195,153,179,.055);
  pointer-events:none;
}
.msg{
  position:relative;
  max-width:80%;
  padding:10px 14px 8px;
  border-radius:20px;
  font-size:13px;
  line-height:1.8;
  box-shadow:0 7px 18px rgba(143,103,126,.08);
  animation:msgIn .18s ease-out;
}
.msg.mine{
  align-self:flex-start;
  color:#5b4654;
  background:linear-gradient(135deg,#eadff7 0%,#f2e3ef 100%);
  border:1px solid rgba(255,255,255,.8);
  border-bottom-left-radius:6px;
}
.msg.mine:after{
  content:"";
  position:absolute;
  left:-5px;
  bottom:1px;
  width:12px;height:12px;
  background:#eadff7;
  clip-path:polygon(100% 0,100% 100%,0 100%);
}
.msg.theirs{
  align-self:flex-end;
  color:#594650;
  background:linear-gradient(135deg,#fff 0%,#fff8fb 100%);
  border:1px solid #f1e2ea;
  border-bottom-right-radius:6px;
}
.msg.theirs:after{
  content:"";
  position:absolute;
  right:-5px;
  bottom:1px;
  width:12px;height:12px;
  background:#fff8fb;
  clip-path:polygon(0 0,100% 100%,0 100%);
}
.msg-time{
  font-size:8px;
  color:#ad98a5;
  margin-top:2px;
}
.composer{
  border-radius:25px;
  padding:7px 7px 7px 11px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(235,218,229,.85);
  box-shadow:0 15px 42px rgba(128,87,115,.16);
}
.composer input{
  font-size:13px;
}
.composer input::placeholder{color:#b3a0aa}
.send{
  width:45px;height:45px;
  border-radius:18px;
  background:linear-gradient(135deg,#d69ab8,#ad91d2);
  box-shadow:0 7px 16px rgba(170,125,166,.22);
  transition:transform .16s ease;
}
.send:active{transform:scale(.93)}
@keyframes msgIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}


/* ===== KHATMIN DARK + WHITE / LTR REDESIGN ===== */
html,body{
  direction:ltr;
  background:#08090c;
  color:#f5f5f7;
}
body{
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.055),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.035),transparent 25%),
    #08090c;
}
.screen{direction:ltr}
.login-card{
  background:rgba(16,17,21,.92);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 25px 80px rgba(0,0,0,.48);
}
.logo{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  background:transparent;
  border-radius:30px;
  box-shadow:none;
  overflow:visible;
}
.logo img{
  position:relative;
  z-index:2;
  width:92px;
  height:92px;
  object-fit:contain;
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  clip-path:inset(100% 0 0 0);
  animation:logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards;
}
.logo:before{
  content:"";
  position:absolute;
  z-index:3;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px 5px rgba(255,255,255,.8);
  left:12px;
  top:96px;
  opacity:0;
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
  pointer-events:none;
}
.logo.replay:before{
  animation:logoPen 1.9s cubic-bezier(.22,.75,.18,1) forwards;
}
.logo.replay:after{
  animation:logoAura 2.2s ease-out 1.25s forwards;
}
.logo:after{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:34px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 66%);
  filter:blur(5px);
  opacity:0;
  animation:logoAura 2.2s ease-out 1.25s forwards;
  pointer-events:none;
}
.login-card h1{color:#fff}
.subtitle{display:none}
.field label,.hint{color:#9a9ba3}
.field label{
  text-align:center;
  font-size:13px;
  letter-spacing:.2px;
}
.field input{
  background:#0e1014;
  color:#fff;
  border:1px solid #282a30;
  text-align:center;
}
.field input::placeholder{text-align:center}
.login-btn{
  text-transform:uppercase;
  letter-spacing:1.2px;
}
@keyframes logoDraw{
  0%{clip-path:inset(100% 0 0 0);transform:scale(.88) rotate(-4deg);opacity:0}
  22%{opacity:1}
  70%{clip-path:inset(20% 0 0 0);transform:scale(1.015) rotate(1deg)}
  100%{clip-path:inset(0 0 0 0);transform:scale(1) rotate(0);opacity:1}
}
@keyframes logoPen{
  0%{opacity:0;left:12px;top:96px;transform:scale(.5)}
  12%{opacity:1}
  45%{left:52px;top:61px}
  72%{left:80px;top:28px}
  100%{left:96px;top:92px;opacity:0;transform:scale(.2)}
}
@keyframes logoGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  45%{filter:drop-shadow(0 0 15px rgba(255,255,255,.34))}
  100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.08))}
}
@keyframes logoAura{
  0%{opacity:0;transform:scale(.7)}
  45%{opacity:1;transform:scale(1.05)}
  100%{opacity:.35;transform:scale(1)}
}
.field input::placeholder{color:#686a73}
.field input:focus{
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
}
.login-btn{
  color:#0a0b0d;
  background:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.error{color:#ff8fa3}

/* KHATMIN title: prevent the final letter from being clipped */
.brand-title{
  overflow: visible !important;
  white-space: nowrap;
  min-width: max-content;
  padding-inline: 6px;
}


/* Modern icon-only navigation — no per-icon boxes */
.bottom-nav .nav-btn svg{
  width:24px !important;
  height:24px !important;
  stroke-linecap:round;
  stroke-linejoin:round;

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function faTime(v){
  try{return new Intl.DateTimeFormat("fa-IR",{hour:"2-digit",minute:"2-digit"}).format(new Date(v))}
  catch{return ""}
}

function setLoginError(msg){
  document.getElementById("loginError").textContent=msg||"";
}

function replayLoginLogo(){
  const logo=document.getElementById("loginLogo");
  if(!logo) return;
  const img=logo.querySelector("img");
  if(!img) return;
  img.style.animation="none";
  logo.style.setProperty("--logo-replay","none");
  void img.offsetWidth;
  img.style.animation="logoDraw 1.9s cubic-bezier(.22,.75,.18,1) forwards, logoGlow 2.4s ease-out 1.45s forwards";
  logo.classList.remove("logo-replay");
  void logo.offsetWidth;
  logo.classList.add("logo-replay");
}

async function login(username,password){
  const u=username.trim();
  if(!u || !password) throw new Error("نام کاربری و رمز عبور را وارد کنید.");

  const {data,error}=await supabaseClient.rpc("login_with_username",{
    p_username:u,
    p_password:password
  });

  if(error){
    console.error("LOGIN RPC ERROR:",error);
    throw new Error("خطای اتصال به دیتابیس: "+(error.message||"RPC error"));
  }

  if(!data || !data.length){
    throw new Error("نام کاربری یا رمز عبور اشتباه است.");
  }

  return data[0];
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("loginBtn");
  setLoginError("");
  btn.disabled=true;
  btn.classList.add("loading");
  btn.textContent="در حال ورود...";

  try{
    const profile=await login(
      document.getElementById("username").value,
      document.getElementById("password").value
    );

    currentUser={profile,id:profile.id};
    sessionStorage.setItem("love_profile",JSON.stringify(profile));
    await loadApp();
  }catch(err){
    console.error(err);
    setLoginError(err.message||"ورود انجام نشد.");
  }finally{
    btn.disabled=false;
    btn.classList.remove("loading");
    btn.textContent="LOGIN";
  }
});

async function loadApp(){
  document.getElementById("loginScreen").classList.add("hidden");
  await renderHome();
}

function shell(content,active="chat"){
  return `
  <div class="app">
    <div class="top">
      <div>
        <div class="brand-title" id="brandTitle" onclick="toggleBrandTitle()" title="تغییر نمایش">KHATMIN</div>
      </div>
      <button class="icon-btn" onclick="logout()" title="خروج">${icons.logout}</button>
    </div>
    <div class="top-divider" aria-hidden="true"></div>
    <div class="content">${content}</div>
    <nav class="bottom-nav">
      <button class="nav-btn ${active==="chat"?"active":""}" onclick="renderHome()">${icons.chat}</button>
      <button class="nav-btn ${active==="game"?"active":""}" onclick="soon()">${icons.game}</button>
      <button class="nav-btn ${active==="book"?"active":""}" onclick="soon()">${icons.book}</button>
      <button class="nav-btn ${active==="settings"?"active":""}" onclick="renderSettings()">${icons.settings}</button>
    </nav>
  </div>`;
}

function toggleBrandTitle(){
  const el=document.getElementById("brandTitle");
  if(!el) return;
  const showingUser=el.classList.toggle("show-user");
  el.textContent=showingUser
    ? `${esc(currentUser.profile.display_name)} ♡`
    : "KHATMIN";
}

async function renderSettings(){
  document.getElementById('app').innerHTML = shell('', 'settings');
}

async function renderHome(){
  const app=document.getElementById("app");
  app.innerHTML=shell(`<div id="chatList" class="chat-list"><div class="empty">در حال آماده‌سازی...</div></div>`,"chat");
  await renderChats();
}

async function renderChats(){
  const list=document.getElementById("chatList");
  const {data:profiles,error:pErr}=await supabaseClient
    .from("profiles")
    .select("id,username,display_name,avatar_url")
    .neq("id",currentUser.id)
    .order("display_name");

  if(pErr){
    list.innerHTML=`<div class="empty">خطا در دریافت مخاطب‌ها: ${esc(pErr.message)}</div>`;
    return;
  }

  if(!profiles?.length){
    list.innerHTML=`<div class="empty">مخاطب دیگری پیدا نشد.</div>`;
    return;
  }

  const cards=[];
  for(const p of profiles){
    const {data:last}=await supabaseClient
      .from("messages")
      .select("id,content,created_at")
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${currentUser.id})`)
      .order("created_at",{ascending:false})
      .limit(1);

    const m=last?.[0];
    cards.push(`
      <button class="chat-card" onclick='openChat(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
        <div class="avatar">${esc((p.display_name||p.username).slice(0,1))}</div>
        <div class="chat-main">
          <div class="chat-name">${esc(p.display_name)}</div>
          <div class="chat-last">${m?esc(m.content):"هنوز پیامی ندارید ♡"}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${m?faTime(m.created_at):""}</div>

        </div>
      </button>`);
  }
  list.innerHTML=cards.join("");
}

async function openChat(partner){
  chatPartner=partner;
  if(realtimeChannel){
    await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }

  document.getElementById("app").innerHTML=`
    <div class="chat-view">
      <header class="chat-header">
        <button class="icon-btn" onclick="renderHome()">${icons.back}</button>
        <div class="avatar" style="width:43px;height:43px;border-radius:14px">${esc(partner.display_name.slice(0,1))}</div>
        <div class="chat-title">${esc(partner.display_name)}</div>
      </header>
      <main id="messages" class="chat-body"><div class="empty">در حال دریافت پیام‌ها...</div></main>
      <form id="composer" class="composer">
        <input id="messageInput" maxlength="5000" autocomplete="off" placeholder="پیامت را بنویس...">
        <button class="send" type="submit">${icons.send}</button>
      </form>
    </div>`;

  document.getElementById("composer").addEventListener("submit",sendMessage);
  await loadMessages();
  subscribeMessages();
}

async function loadMessages(){
  const box=document.getElementById("messages");
  const {data,error}=await supabaseClient
    .from("messages")
    .select("id,sender_id,receiver_id,content,created_at")
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatPartner.id}),and(sender_id.eq.${chatPartner.id},receiver_id.eq.${currentUser.id})`)
    .order("created_at",{ascending:true});

  if(error){
    box.innerHTML=`<div class="empty">خطا در دریافت پیام‌ها: ${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    box.innerHTML=`<div class="empty">هنوز گفت‌وگویی شروع نشده ♡</div>`;
    return;
  }

  box.innerHTML=data.map(renderMessage).join("");
  box.scrollTop=box.scrollHeight;
}

function renderMessage(m){
  const mine=m.sender_id===currentUser.id;
  return `<div class="msg ${mine?"mine":"theirs"}">${esc(m.content)}<div class="msg-time">${faTime(m.created_at)}</div></div>`;
}


function subscribeMessages(){
  realtimeChannel=supabaseClient
    .channel("love-messages-"+currentUser.id+"-"+chatPartner.id)
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"messages"},
      payload=>{
        const m=payload.new;
        const relevant=
          (m.sender_id===currentUser.id&&m.receiver_id===chatPartner.id) ||
          (m.sender_id===chatPartner.id&&m.receiver_id===currentUser.id);
        if(!relevant)return;
        const box=document.getElementById("messages");
        if(!box)return;
        if(box.querySelector(".empty"))box.innerHTML="";
        if(document.querySelector(`[data-msg-id="${m.id}"]`))return;
        box.insertAdjacentHTML("beforeend",`<div data-msg-id="${esc(m.id)}">${renderMessage(m)}</div>`);
        box.scrollTop=box.scrollHeight;
      })
    .subscribe(status=>console.log("Realtime:",status));
}

async function sendMessage(e){
  e.preventDefault();
  const input=document.getElementById("messageInput");
  const content=input.value.trim();
  if(!content)return;

  input.disabled=true;

  const {error}=await supabaseClient.from("messages").insert({
    sender_id:currentUser.id,
    receiver_id:chatPartner.id,
    content
  });

  input.disabled=false;
  if(error){
    alert("پیام ارسال نشد: "+error.message);
    return;
  }
  input.value="";
  input.focus();
}

function soon(){alert("این بخش به‌زودی فعال می‌شود ♡")}

async function logout(){
  if(realtimeChannel){
    await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }
  currentUser=null;
  chatPartner=null;
  sessionStorage.removeItem("love_profile");
  document.getElementById("app").innerHTML="";
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value="";
  setLoginError("");
  replayLoginLogo();
}

(async()=>{
  const saved=sessionStorage.getItem("love_profile");
  if(saved){
    try{
      const profile=JSON.parse(saved);
      if(profile?.id){
        currentUser={profile,id:profile.id};
        await loadApp();
        return;
      }
    }catch(e){}
  }
  document.getElementById("loginScreen").classList.remove("hidden");
})();
</script>
